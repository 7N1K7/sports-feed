<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0e1211;overflow:hidden}
body{font-family:"Source Sans 3",sans-serif;color:#e6eeea;position:relative}
.wrap{position:absolute;left:40px;right:40px;top:48px;display:flex;flex-direction:column;align-items:center;text-align:center}
.head{display:flex;align-items:center;gap:26px}
.head img{width:146px;height:146px;border-radius:30px;flex:none}
.name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:156px;letter-spacing:.012em;line-height:.86;text-transform:uppercase;color:#e9eeec;white-space:nowrap}
.name span{color:#45c08f}
.what{margin-top:30px;font-size:42px;font-weight:700;color:#e9eeec;letter-spacing:-.005em}
.tag{margin-top:6px;font-size:28px;color:#93a49d;font-weight:600}
.chips{margin-top:26px;display:grid;gap:12px;justify-items:center}
.row{display:flex;gap:12px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:23px;color:#e9eeec;border:2.5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,#141b19);border-radius:999px;padding:5px 16px 5px 9px}
.chip img{width:27px;height:27px}
.foot{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;align-items:baseline;gap:22px}
.free{font-size:27px;font-weight:700;color:#45c08f}
.free span{color:#93a49d;font-weight:600}
.url{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;letter-spacing:.02em;color:#e9eeec}
.url b{color:#45c08f}
.dotsep{color:#3b4a44;font-size:30px}
</style></head><body>
<div class="wrap">
  <div class="head"><img src="logo.svg"><div class="name" id="nm">Kickoff <span>Kiwi</span></div></div>
  <div class="what">Kick-off times for every NZ team, all in one feed</div>
  <div class="tag">NZ start times · where to watch · live scores · no spoilers</div>
  <div class="chips"><div class="row"><span class="chip" style="--c:#fcc419"><img src="icons/cricket.svg">Cricket</span><span class="chip" style="--c:#d5dbd8"><img src="icons/rugby.svg">Rugby</span><span class="chip" style="--c:#ff922b"><img src="icons/league.svg">League</span><span class="chip" style="--c:#51cf66"><img src="icons/football.svg">Football</span><span class="chip" style="--c:#3bc9db"><img src="icons/hockey.svg">Hockey</span><span class="chip" style="--c:#e4a672"><img src="icons/basketball.svg">Basketball</span></div><div class="row"><span class="chip" style="--c:#9775fa"><img src="icons/netball.svg">Netball</span><span class="chip" style="--c:#4dabf7"><img src="icons/motor.svg">F1</span><span class="chip" style="--c:#c0d32a"><img src="icons/tennis.svg">Tennis</span><span class="chip" style="--c:#ff6b6b"><img src="icons/mma.svg">MMA</span><span class="chip" style="--c:#f783ac"><img src="icons/boxing.svg">Boxing</span></div></div>
</div>
<div class="foot"><div class="url">kickoff<b>.</b>kiwi</div><span class="dotsep">|</span><div class="free">Free · <span>no sign-up, no account, no app store</span></div></div>
</body></html>
