<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0e1211;overflow:hidden}
body{font-family:"Source Sans 3",sans-serif;color:#e6eeea;position:relative}
.wrap{position:absolute;left:90px;right:90px;top:120px}
.head{display:flex;align-items:center;gap:34px}
.head img{width:150px;height:150px;border-radius:30px}
.name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:150px;letter-spacing:.015em;line-height:.9;text-transform:uppercase;color:#e9eeec}
.name span{color:#45c08f}
.tag{margin-top:34px;font-size:32px;color:#93a49d;font-weight:600}
.chips{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;max-width:1020px}
.chip{font-weight:700;font-size:25px;color:#121816;border-radius:999px;padding:9px 21px}
.url{position:absolute;right:90px;bottom:54px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;letter-spacing:.02em;color:#e9eeec}
.url b{color:#45c08f}
.cal{position:absolute;left:90px;bottom:62px;font-size:24px;color:#93a49d;font-weight:600}
</style></head><body>
<div class="wrap">
  <div class="head"><img src="logo.svg"><div class="name">Kickoff <span>Kiwi</span></div></div>
  <div class="tag">NZ start times · where to watch · rain delays · no spoilers</div>
  <div class="chips">
    <span class="chip" style="background:#45c08f">Rugby</span><span class="chip" style="background:#7fb6ea">Cricket</span><span class="chip" style="background:#f0a160">League</span><span class="chip" style="background:#b9a0f5">Football</span><span class="chip" style="background:#6cc3e0">F1</span><span class="chip" style="background:#cfe05a">Tennis</span><span class="chip" style="background:#f283a8">UFC</span><span class="chip" style="background:#ff8f7a">Boxing</span>
  </div>
</div>
<div class="cal">📅 Games in your calendar, with reminders</div>
<div class="url">kickoff<b>.</b>kiwi</div>
</body></html>
