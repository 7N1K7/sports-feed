name: probe
on: { push: { branches: [probe], paths-ignore: ['probe/out*'] } }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # the browser only when the probe uses it (it takes minutes to install)
      - run: if grep -q playwright probe/probe.mjs; then npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium; fi
      - run: rm -f probe/out-*.png && node probe/probe.mjs > probe/out.txt 2>&1 || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAS_STATS_PASSWORD: ${{ secrets.STATS_PASSWORD != '' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
      # save the output; a run whose output didn't change has nothing to save, which isn't a failure
      - run: git -c user.name=bot -c user.email=bot@x add -A probe/out* && (git diff --cached --quiet || (git -c user.name=bot -c user.email=bot@x commit -m out && git push))
