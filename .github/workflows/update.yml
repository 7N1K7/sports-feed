name: Update feed and publish site

on:
  push:
    branches: [main]
  schedule:
    # The slow cycle (GitHub often starts these late). While a game is on or about to start, the chain
    # job below adds a run every 10 minutes; a scheduled run restarts the chain when the next game nears.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # the alert when a new build doesn't show its games (below)

# One run at a time, and at most one waiting. Nothing cancels a running build, so a burst of pushes
# can't stall the scores; the chain job below steps aside as soon as another run is waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.t0.outputs.started }}
      hot: ${{ steps.fetch.outputs.hot }}
      every: ${{ steps.fetch.outputs.every }}
    steps:
      - id: t0
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for the site version number
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache
          key: og-${{ github.run_id }}
          restore-keys: og-
      # the page's own version, which its error reports carry (so the stats page can tell a fixed error from one that's back)
      - run: sed -i "s/__SITE_V__/$(git rev-list --count HEAD)/" index.html
      - id: fetch
        run: node scripts/fetch.mjs
        env:
          # Sportmonks' free cricket API token (live state for T20Is and the Big Bash); skipped when the secret isn't set
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          # YouTube Data API key: free live streams on the sports bodies' channels; skipped when the secret isn't set
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # balldontlie's free API key: the NBA's games and results; skipped when the secret isn't set
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
      # The new site, opened in Chrome (already on GitHub's machines) before it goes live, on a desktop and a phone-sized
      # screen. If its games aren't drawn, this build stops here: the site that's live stays up, and an issue is opened
      # on the repo so the owner gets an email; the next build that draws fine closes it. A problem with the check
      # itself (the browser or its driver not to hand) only warns
      - name: Check the new site shows its games
        id: check
        run: |
          npm i --prefix "$RUNNER_TEMP/chk" --no-audit --no-fund --silent playwright-core@1.56.1 || echo "::warning::Couldn't install the site check"
          CHECK_DEPS="$RUNNER_TEMP/chk" CHECK_OUT="$RUNNER_TEMP/check.txt" node scripts/check-site.mjs
      - name: Raise the alarm (the new build wasn't put live)
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "The site's new build didn't show its games, so it wasn't put live"
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null and .title == env.TITLE) | .number' | head -1)
          [ -n "$n" ] && { echo "Already raised in #$n"; exit 0; }
          { echo "The build in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID was opened in Chrome before going live, and its games weren't drawn, so it wasn't deployed. The site keeps showing the last good build: its games and times are there, but scores and changes stop updating until this is fixed."
            echo; echo "What the check saw:"; echo; sed 's/^/- /' "$RUNNER_TEMP/check.txt"
            echo; echo "This closes by itself when a later build shows its games again. cc @$GITHUB_REPOSITORY_OWNER"; } > "$RUNNER_TEMP/issue.md"
          gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -F body=@"$RUNNER_TEMP/issue.md" --jq '.html_url'
      - name: All clear (closes the alarm, if one is open)
        continue-on-error: true   # never holds back a good build
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "The site's new build didn't show its games, so it wasn't put live"
        run: |
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null and .title == env.TITLE) | .number'); do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="Fixed: the build in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID showed its games and went live." --silent || true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$n" -f state=closed -f state_reason=completed --silent || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # After a good deploy, wait until 10 minutes after this run's build began (5 while a game is being played, 30 when
  # nothing's on), then start the next run. It always runs: GitHub's own schedule is too patchy to lean on (on
  # 3 Nov 2026 it fired once in 7 hours), so the half-hourly cron is only the fallback that restarts a broken chain.
  # Skips the dispatch when another run of this workflow is already queued or running (a push, the
  # fallback cron, a manual run): that run carries the chain on, so there is only ever one chain.
  chain:
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STARTED: ${{ needs.build.outputs.started }}
      EVERY: ${{ needs.build.outputs.every || 600 }}
    steps:
      - name: Start the next run 10 minutes after this one
        run: |
          secs=$(( ${STARTED:-0} + EVERY - 10 - $(date +%s) ))
          if [ "$secs" -gt "$EVERY" ] || [ -z "$STARTED" ]; then secs=$(( EVERY - 180 )); fi
          deadline=$(( $(date +%s) + secs ))
          busy() { gh api "repos/$REPO/actions/workflows/update.yml/runs?per_page=30" --jq \
            '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .status != "completed" and .created_at > (now - 7200 | todate))] | length'; }
          # Wait, but give way at once to a push or scheduled run waiting behind this one: it carries the chain on.
          while :; do
            if [ "$(busy)" -gt 0 ]; then echo "Another run is queued or running; it carries the chain on."; exit 0; fi
            left=$(( deadline - $(date +%s) )); [ "$left" -le 0 ] && break
            sleep $(( left < 20 ? left : 20 ))
          done
          # GitHub's API sometimes answers 502 for a moment: try again, and if it's still down, leave it to the
          # half-hourly schedule to restart the chain rather than fail the run (and send a failure email)
          for wait in 5 15 45 0; do
            if gh workflow run update.yml --repo "$REPO" --ref main; then echo "Started the next run."; exit 0; fi
            [ "$wait" -gt 0 ] && sleep "$wait"
          done
          echo "::warning::Couldn't start the next run; the half-hourly schedule restarts the chain."
