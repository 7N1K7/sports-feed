<style>
/* Layout: sticky scoreboard header, week strip, then one column of day-grouped fixture rows, results and news. */
:root {
  --paper: #f3f6f4; --surface: #ffffff; --ink: #14211c; --muted: #5a6a64; --line: #d9e2de;
  --accent: #0d6b4d; --accent-ink: #ffffff; --soft: #e6efeb;
  --rugby: #1b1f1d; --cricket: #b88a00; --league: #e8590c; --football: #2b8a3e; --mma: #d32f2f; --boxing: #d6336c; --motor: #1c7ed6;
  --live: #c8322a; --cover: #dfe6e3;
  --soon: #d9480f; --near: #7048e8; --later: #5a6a64; --local: #1971c2;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1412; --surface: #161f1c; --ink: #e6eeea; --muted: #93a49d; --line: #25322d;
  --accent: #46c093; --accent-ink: #08130f; --soft: #1c2925;
  --rugby: #d5dbd8; --cricket: #fcc419; --league: #ff922b; --football: #51cf66; --mma: #ff6b6b; --boxing: #f783ac; --motor: #4dabf7;
  --live: #ff6b5f; --cover: #25322d; --soon: #ff8a4c; --near: #a98bff; --later: #93a49d; --local: #74b9ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0e1412; --surface: #161f1c; --ink: #e6eeea; --muted: #93a49d; --line: #25322d;
  --accent: #46c093; --accent-ink: #08130f; --soft: #1c2925;
  --rugby: #d5dbd8; --cricket: #fcc419; --league: #ff922b; --football: #51cf66; --mma: #ff6b6b; --boxing: #f783ac; --motor: #4dabf7;
  --live: #ff6b5f; --cover: #25322d; --soon: #ff8a4c; --near: #a98bff; --later: #93a49d; --local: #74b9ff; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0 }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; line-height: 1 }
.brand span { color: var(--accent) }
.clock { color: var(--muted); font-size: 13px }
.ver { color: var(--muted); font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: center }
.btn:hover { border-color: var(--accent) }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }

.mock { background: var(--soft); color: var(--muted); font-size: 13px }
.mock .wrap { padding-block: 8px }

.panel { background: var(--surface); border-bottom: 1px solid var(--line) }
.panel .wrap { padding-block: 16px; display: grid; gap: 14px }
.group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--f-body); font-weight: 700; margin-bottom: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 14px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.spoil-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px }
select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink) }

main { padding-block: 18px 48px; display: grid; gap: 28px }
section > h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .04em; display: flex; flex-wrap: wrap; column-gap: 10px; align-items: baseline; gap: 10px; margin-bottom: 10px }
section > h2 small { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--muted); font-weight: 400 }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 4px; text-align: center; cursor: pointer; display: grid; gap: 2px; min-width: 0 }
.day:hover { border-color: var(--accent) }
.day .dn { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.day .dd { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1 }
.day .dots { display: flex; gap: 3px; justify-content: center; min-height: 8px; flex-wrap: wrap }
.dot { width: 7px; height: 7px; border-radius: 50% }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.day.empty .dd { color: var(--muted) }

.daygroup { display: grid; gap: 8px }
.daygroup + .daygroup { margin-top: 14px }
.dayhead { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); scroll-margin-top: 80px }

.ev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; overflow: hidden }
.ev .stripe { background: var(--sport) }
.ev .body { padding: 10px 12px; min-width: 0; display: grid; gap: 2px }
.ev .comp { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--sport); font-weight: 700 }
.ev .teams { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.15 }
.ev .teams .v { color: var(--muted); font-weight: 500; padding-inline: 4px }
.ev .meta { font-size: 13px; color: var(--muted) }
.watch { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; margin-top: 4px }
.watch .wl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; border: 1px solid var(--sport); color: var(--sport); border-radius: 4px; padding: 0 5px }
.watch .alt { font-weight: 600 }
.watch .muted { color: var(--muted) }
.ev .when { padding: 10px 12px; text-align: right; display: grid; align-content: center; gap: 2px; border-left: 1px dashed var(--line); min-width: 112px }
.ev .nz { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1 }
.ev .nzl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.ev .loc { font-size: 12px; color: var(--muted) }
.ev .comp .series { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--muted) }
.ev .comp .series::before { content: '· '; }
@media (max-width: 560px) { .ev .comp .series { flex-basis: 100% } .ev .comp .series::before { content: none } }
.ev .hl { justify-self: end; font-size: 13px; font-weight: 700; color: #e03131; text-decoration: none; padding: 3px 9px; border: 1px solid color-mix(in srgb, #e03131 40%, transparent); border-radius: 999px }
.ev .hl:hover { background: color-mix(in srgb, #e03131 10%, transparent) }
@media (max-width: 560px) { .ev .hl { justify-self: start } }
.ev .pending { font-size: 13px; font-weight: 600; color: var(--muted) }
.ev .rloc { font-size: 12px; color: var(--muted); margin-top: 5px }
.ev .tvl { font-size: 13px; font-weight: 600; color: var(--ink) }
.ev .tvl a { color: inherit }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: var(--soft); color: var(--ink); justify-self: end }
.tag.live { background: var(--live); color: #fff }
.sport-rugby { --sport: var(--rugby) } .sport-cricket { --sport: var(--cricket) } .sport-league { --sport: var(--league) } .sport-football { --sport: var(--football) } .sport-mma { --sport: var(--mma) } .sport-boxing { --sport: var(--boxing) } .sport-motor { --sport: var(--motor) }

.res .when { min-width: 120px }
.res .score { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1 }
.res .score.long { font-size: 15px; font-family: var(--f-body); font-weight: 600; line-height: 1.3 }
.res .summary { font-size: 14px; margin-top: 2px }
.cover { background: var(--cover); border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; text-align: center; line-height: 1.25 }
.cover b { display: block; font-size: 14px }

.news { display: grid; gap: 8px }
.ni { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 3px }
.ni .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.kind { text-transform: uppercase; letter-spacing: .07em; font-weight: 700; font-size: 11px; border-radius: 4px; padding: 1px 5px; background: var(--soft); color: var(--ink) }
.kind.injury { background: var(--live); color: #fff }
.ni h3 { font-family: var(--f-body); font-size: 16px; font-weight: 700; line-height: 1.3 }
.ni p { margin: 0; font-size: 14px; color: var(--muted); max-width: 68ch }
.ni a { color: var(--accent); font-size: 13px }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px }
.empty-note { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px }
.more { justify-self: start }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px }
footer a { color: var(--muted) }


.badge { display: inline-grid; place-items: center; min-width: 30px; height: 18px; padding: 0 4px; border-radius: 4px; font: 700 10px/1 var(--f-body); letter-spacing: .03em; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent); flex: none }
.ev .comp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px }
.sp { background: var(--sport); color: var(--paper); border-radius: 4px; padding: 1px 6px; font-size: 10px; letter-spacing: .08em }
.logo { width: 1.1em; height: 1.1em; object-fit: contain; vertical-align: -0.15em; margin-right: 5px }
.flag { margin-right: 5px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif }
.chip { display: inline-flex; align-items: center; gap: 6px }
.sportchip.sport-all { --sport: var(--ink) }
.sportchip { border-color: var(--sport) }
.nowbar { display: flex; flex-wrap: nowrap; align-items: center; justify-content: safe center; gap: 6px; margin: 0 auto -12px; overflow-x: auto; scrollbar-width: none; padding: 2px }
.nowbar::-webkit-scrollbar { display: none }
.nowchip { flex: none; font-size: 13px; padding: 4px 10px; min-height: 0 }
.nowchips { display: contents }
.nowlbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; display: inline-flex; align-items: center; gap: 6px }
.nowchip.is-live { border-color: #e03131 }
.livetag { margin-left: 6px; font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: #e03131; border-radius: 4px; padding: 1px 5px }
@media (prefers-reduced-motion: no-preference) { .nowchip.is-live .livetag { animation: tagpulse 2s ease-in-out infinite } @keyframes tagpulse { 50% { opacity: .55 } } }
.copt .current { white-space: nowrap; margin-left: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent) }
.copt .onnow, .copt .ended { white-space: nowrap; margin-left: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #e03131 }
.copt .ended { color: var(--muted); font-weight: 600 }
.nowchip { border-color: var(--sport); background: color-mix(in srgb, var(--sport) 8%, var(--paper)); font-weight: 600 }
.nowchip[aria-pressed="true"] { background: var(--sport); color: var(--paper) }
.sportchip[aria-pressed="true"] { background: var(--sport); border-color: var(--sport); color: var(--paper) }
/* women's games in violet and wheelchair games in teal, whatever the sport, so mixed competitions read apart at a glance */
.ev.g-w { --sport: #7048e8 } .ev.g-wc { --sport: #0c8599 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ev.g-w { --sport: #9775fa } :root:not([data-theme="light"]) .ev.g-wc { --sport: #3bc9db } }
:root[data-theme="dark"] .ev.g-w { --sport: #9775fa } :root[data-theme="dark"] .ev.g-wc { --sport: #3bc9db }
.sport-rugby .ev, .ev.sport-rugby { background: color-mix(in srgb, var(--rugby) 5%, var(--surface)) }
.ev.sport-cricket { background: color-mix(in srgb, var(--cricket) 5%, var(--surface)) }
.ev.sport-league { background: color-mix(in srgb, var(--league) 6%, var(--surface)) }
.ev.sport-football { background: color-mix(in srgb, var(--football) 6%, var(--surface)) }
.ev.sport-boxing { background: color-mix(in srgb, var(--boxing) 6%, var(--surface)) }
.ev.sport-mma { background: color-mix(in srgb, var(--mma) 6%, var(--surface)) }
.ev.sport-motor { background: color-mix(in srgb, var(--motor) 6%, var(--surface)) }
/* races have no opponent: one centred title (the Grand Prix), circuit and town small underneath */
.ev .teams.solo { display: grid; justify-items: center; text-align: center; gap: 2px; margin-block: auto; padding-block: 6px }
.teams.solo .nm, .dteams.solo { overflow-wrap: anywhere; text-wrap: balance }
.teams.solo .where, .dteams.solo small { display: block; font-family: var(--f-body); font-size: 13px; font-weight: 600; line-height: 1.3; letter-spacing: 0; color: var(--muted) }
.dteams.solo small { font-size: 14px; margin-top: 4px }
:is(body.v-compact, body.v-mixed :is(#upcoming, #tomorrow, #later, #results, .donetoday, #dayPick, #hubBody)) .ev .teams.solo .where { display: none }
/* points-only standings (drivers, constructors) sit side by side when there's room */
#hubBody:has(> .stable.points) { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 18px }
#hubBody > .stable.points { flex: 1 1 320px; min-width: 0 }
#hubBody:has(> .stable.points) > p { flex-basis: 100% }
.ev .stripe { width: 6px }
/* the same 6px sport edge on the right, inside the border like the left stripe */
.ev { position: relative }
.ev::after { content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 6px; background: var(--sport); pointer-events: none }
.ni .top .badge { margin-right: 2px }
#sportFilter { margin-bottom: -10px; justify-content: center }
#newsFilters { justify-content: center }


.ev .nz { color: var(--sport) }
.ev .date { font-size: 13px; font-weight: 700; color: var(--ink) }
.ev .loc { color: var(--local) }
.tag.soon { background: var(--soon); color: #fff }
.tag.near { background: var(--near); color: #fff }
.tag.later { background: transparent; color: var(--later); box-shadow: inset 0 0 0 1px var(--line) }
.dayhead { color: var(--ink) }
.dayhead::after { content: ""; display: block; height: 2px; width: 32px; background: var(--accent); margin-top: 4px; border-radius: 2px }


.ev[data-open] { cursor: pointer }

.rehide { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 2px 0; justify-self: end }
.dres .rehide { justify-self: start }

.livelink:hover { text-decoration: underline }
.ev .when .livelink { margin-top: 6px }
.ev .wx { font-size: 12px; font-weight: 700; color: #1c7ed6; margin-top: 4px }
.ev .tv { color: var(--ink); font-weight: 600 }
dialog#sheet { border: 0; padding: 0; margin: auto auto 0; width: min(640px, 100%); max-height: 88vh; border-radius: 16px 16px 0 0; background: var(--surface); color: var(--ink); box-shadow: 0 -8px 40px rgba(0,0,0,.25) }
@media (min-width: 700px) { dialog#sheet { margin: auto; border-radius: 16px } }
dialog#sheet::backdrop { background: rgba(10, 18, 15, .5) }
.sheet-in { padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; overflow-y: auto; max-height: 88vh }
.close { justify-self: end; position: sticky; top: 0 }

.dteams .v { color: var(--muted); font-weight: 500 }
.sheet-head .tag { justify-self: start }

#sheetBody { display: flow-root }
dialog#sheet { width: min(720px, 100%) }
.close { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; z-index: 2 }

.sheet-head { padding-right: 40px; gap: 8px }

const cityOf = e => (e.city || '').split(',')[0];

// rough match lengths, used for "On now"
const HOURS = { Test: 7 * 24 * 0 + 8, ODI: 8, 'List A': 8, T20I: 3.5, T20: 3.5, 'First-class': 8 };
const DAYS = { Test: 5, 'First-class': 4 };
// cricket format from the feed, or from the stage/comp name ("2nd Test", "1st T20I")
const formatOf = e => e.format || (/\bTests?\b/.test(`${e.stage || ''} ${e.comp || ''}`) ? 'Test' : /\bODI/.test(`${e.stage || ''} ${e.comp || ''}`) ? 'ODI' : /\bT20/.test(`${e.stage || ''} ${e.comp || ''}`) ? 'T20I' : '');
function onNow(e, now) {
  const s = new Date(e.startUTC);
  const f = e.sport === 'cricket' ? formatOf(e) : '';
  const days = DAYS[f] || 1;
  // a cricket day can run long with rain; a game whose time isn't known yet sits at 2pm local, so widen the window both ways
  const hrs = e.sport === 'cricket' ? (HOURS[f] || 8) + 2 : 2;
  const early = e.timeTBC ? 5 * 36e5 : 0, late = e.timeTBC ? 4 * 36e5 : 0;
  for (let i = 0; i < days; i++) {
    const a = s.getTime() + i * 864e5 - early, b = a + early + hrs * 36e5 + late;
    if (now >= a && now <= b) return days > 1 ? `Day ${i + 1}` : 'On now';
  }
  return null;
}
function countdown(e, now) {
  const ms = new Date(e.startUTC) - now;
  if (ms <= 0) return null;
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  if (d >= 2) return `in ${d} days`;
  if (h >= 1) return `in ${h}h ${Math.floor(ms / 6e4) % 60}m`;
  return `in ${Math.max(1, Math.floor(ms / 6e4))}m`;
}
function canRehide(id, start, now) { return spoilers && revealed.has(id) && now - new Date(start) < spoilDays * 864e5; }
const rehideBtn = id => `<button class="rehide" type="button" data-rehide="${esc(id)}">Hide again</button>`;
function isHidden(e, now) {
  if (!spoilers || revealed.has(e.id)) return false;
  return now - new Date(e.startUTC) < spoilDays * 864e5;
}
// an event also shows for the other side when both are followed (e.g. Blues v Hurricanes)
const CLUBS = ['blues','chiefs','hurricanes','crusaders','highlanders','warriors'];
const visibleTeam = x => picked.has(x.team) || (x.tags || []).some(t => picked.has(t)) || CLUBS.some(k => picked.has(k) && [x.home, x.away].some(t => (t || '').includes(TEAM_NAME[k])));
const visible = x => (genderSel === 'all' || !genderOf(x) || genderOf(x) === genderSel) && (!nzOnly || isNZ(x)) && visible0(x);
const visible0 = x => x.startUTC ? (compSel ? compOf(x) === compSel : visibleTeam(x) && (sportSel === 'all' || (x.sport || sportOf(x.team)) === sportSel))
  : visibleTeam(x) && (sportSel === 'all' || sportOf(x.team) === sportSel);

// cricket tours: "Game 4 of 5 · India lead the T20I series 2–1", counting only results the spoiler setting shows
const fmtOf = c => (/\bT20I?\b/i.test(c) ? 'T20I' : /\bODI\b/.test(c) ? 'ODI' : /\bTest\b/.test(c) ? 'Test' : '');
function seriesLine(e, now) {
  const f = fmtOf(e.comp || '');
  if (e.sport !== 'cricket' || !f || !/(^|v )(Black Caps|White Ferns|Australia)( v |$)/.test(compOf(e))) return '';
  const all = (FEED.events || []).filter(x => compOf(x) === compOf(e) && fmtOf(x.comp || '') === f).sort((a, b) => a.startUTC.localeCompare(b.startUTC));
  if (all.length < 2) return '';
  const n = all.findIndex(x => x.id === e.id) + 1;
  const base = s => (s || '').replace(/\s+Women('s)?$/, '').toLowerCase();
  const wins = { [e.home]: 0, [e.away]: 0 };
  let counted = 0;
  for (const x of all.slice(0, n - 1)) {
    if (x.status !== 'final' || isHidden(x, now)) continue;
    const w = base(((x.summary || x.score || '').match(/^(.+?) won\b/i) || [])[1]);
    counted++;
    for (const t of [e.home, e.away]) if (w && (base(t) === w || base(t).startsWith(w) || w.startsWith(base(t)))) wins[t]++;
  }
  let state = '';
  if (counted) {
    const [a, b] = [e.home, e.away].sort((x, y) => wins[y] - wins[x]);
    state = wins[a] === wins[b] ? ` · ${f} series level ${wins[a]}–${wins[b]}` : ` · ${esc(displayName(a, e))} lead the ${f} series ${wins[a]}–${wins[b]}`;
  }
  return `<span class="series">${f === 'Test' ? 'Test' : 'Game'} ${n} of ${all.length}${state}</span>`;
}

function evCard(e, now) {
  const d = new Date(e.startUTC);
  const overseas = e.tz && e.tz !== NZ;
  const live = e.status === 'live' ? 'On now' : onNow(e, now);
  const cd = countdown(e, now);
  const ms = d - now;
  const urg = ms < 864e5 ? 'soon' : ms < 3 * 864e5 ? 'near' : 'later';
  const tag = live ? `<span class="tag live">${live}</span>` : cd ? `<span class="tag num ${urg}">${cd}</span>` : '';
  const local = overseas ? `<div class="loc num">${e.timeTBC ? '' : time(d, e.tz) + ' '}${fmt(d, e.tz, { weekday: 'short' })} in ${wikiLink(cityOf(e))}</div>` : '';
  const tv = e.broadcast && e.broadcast !== 'TBC' ? e.broadcast.split(' / ')[0] : e.watchAlt ? e.watchAlt.split(/[;(]/)[0] : '';
  const state = live ? 'is-live' : ms > 0 && ms < 3 * 36e5 ? 'is-soon' : '';
  return `<article class="ev sport-${e.sport} ${gcls(e)} ${state}" data-open="${esc(e.id)}" tabindex="0" role="button" aria-label="${esc(titleOf(e))}, details">
    <div class="stripe"></div>
    <div class="body">
      <div class="comp">${sIcon(e.sport)}${compBadge(e)}<span>${esc(cardComp(e))}</span>${seriesLine(e, now)}</div>
      ${solo(e) ? soloTitle(e) : `<div class="teams matchup"><span class="side home">${teamName(e.home, e.homeLogo, e)}</span><span class="v">v</span><span class="side away">${teamNameR(e.away, e.awayLogo, e)}</span></div>`}
    </div>
    <div class="when">
      <div class="nzl">${START_LABEL[e.sport] || 'Start'} NZ</div>
      <div class="nz num">${e.timeTBC ? 'TBC' : time(d, NZ)}</div>
      <div class="date">${dayLabel(d, NZ)}</div>
      ${local || (cityOf(e) || e.venue ? `<div class="loc">${wikiLink(cityOf(e) || e.venue)}</div>` : '')}${tag}${live && wxNote(e) ? `<div class="wx" title="${esc(e.weather)}">🌧 ${esc(wxNote(e))}</div>` : ''}${live ? liveLink(e) : ''}${tv ? `<div class="tvl"><span aria-hidden="true">📺</span> ${linkWatch(tv)}</div>` : ''}
    </div>
  </article>`;
}
// Watch services -> their sites (home pages; apps open from there)
const SERVICES = {
  'Sky Sport Now': 'https://www.skysportnow.co.nz', 'Sky Go': 'https://www.skygo.co.nz', 'Sky Sport': 'https://www.sky.co.nz/sport',
  'TVNZ+': 'https://www.tvnz.co.nz', 'TVNZ 1': 'https://www.tvnz.co.nz', 'ThreeNow': 'https://www.threenow.co.nz', 'Three': 'https://www.threenow.co.nz',
  'scoring.nzc.nz': 'https://scoring.nzc.nz', 'NZC YouTube': 'https://www.youtube.com/@blackcaps', 'NZC live stream': 'https://www.nzc.nz', 'nzc.nz': 'https://www.nzc.nz',
  RNZ: 'https://www.rnz.co.nz/live', DAZN: 'https://www.dazn.com', Netflix: 'https://www.netflix.com', 'ICC.tv': 'https://www.icc.tv',
};
const SVC_RE = new RegExp(`(${Object.keys(SERVICES).sort((a, b) => b.length - a.length).map(k => k.replace(/[.+]/g, '\\$&')).join('|')})(?![\\w+])`, 'g');
const linkWatch = t => esc(t).replace(SVC_RE, m => `<a class="svc" href="${SERVICES[m]}" target="_blank" rel="noopener">${m}</a>`);
const LIVE_SITE = { cricket: ['Cricinfo', 'https://www.espncricinfo.com/live-cricket-score'] };
// the game's own Cricinfo page, when Wikipedia's match box links to it
const FIGHT = /^(mma|boxing)$/;
const cricinfo = e => e.cricinfo || (/cricinfo\.com/.test(e.link || '') ? e.link : '');
// a venue or city opens its Wikipedia article (Wikipedia's "go" search lands on the page when the name matches)
const wikiLink = n => `<a class="svc" href="https://en.wikipedia.org/wiki/Special:Search?go=Go&search=${encodeURIComponent(n)}" target="_blank" rel="noopener">${esc(n)}</a>`;
// Wikipedia's match box notes rain during a game; a short label for the card
const wxNote = e => !e.weather ? '' : /no play|abandon/i.test(e.weather) ? 'No play yet' : /bad light/i.test(e.weather) && !/rain/i.test(e.weather) ? 'Bad light' : /rain|wet/i.test(e.weather) ? 'Rain affected' : '';
function liveLink(e) {
  let [name, url] = LIVE_SITE[e.sport] || ['match centre', e.link || e.source];
  if (cricinfo(e)) [name, url] = ['Cricinfo', cricinfo(e)];
  return url ? `<a class="livelink" href="${esc(e.sport === 'cricket' ? url : url)}" target="_blank" rel="noopener">Live ${FIGHT.test(e.sport) ? 'on the fight page' : e.sport === 'motor' ? 'timing on the race page' : `scores on ${esc(e.sport === 'cricket' ? name : 'match page')}`} ↗</a>` : '';
}
function watchLine(e) {
  const b = e.broadcast && e.broadcast !== 'TBC' ? e.broadcast : '';
  if (!b && !e.watchAlt) return `<div class="watch"><span class="wl">Watch</span><span class="muted">Broadcaster to be confirmed</span></div>`;
  const alt = e.watchAlt ? `<span class="alt">${b ? 'Also: ' : ''}${linkWatch(e.watchAlt)}</span>` : '';
  const note = e.watchNote && /not on|no tv|not televised/i.test(e.watchNote) ? `<span class="muted">${esc(e.watchNote)}</span>` : '';
  return `<div class="watch"><span class="wl">Watch</span>${b ? `<span>${linkWatch(b)}</span>` : ''}${alt}${note}</div>`;

// a YouTube search for the match, so it works whenever the official highlights go up
function highlights(e, now) {

function resCard(e, now) {

function hubTeams() {
  const keys = new Set();
  for (const e of FEED.events || []) if (compOf(e) === compSel) { keys.add(e.team); (e.tags || []).forEach(t => keys.add(t)); }
  return keys;
}
function hubNews(n) {
  const words = compSel.replace(/\b(Men's|Women's|League|Cup|Rugby|Pacific)\b/g, '').trim();
  return hubTeams().has(n.team) || (words.length > 3 && (n.title + ' ' + n.summary).includes(words)) || (n.title + ' ' + n.summary).includes(compSel);
}
function hubTables() {
  const ts = (FEED.tables || []).filter(t => compOf({ comp: t.comp, sport: t.sport, team: t.team }) === compSel);
  const yr = t => +(t.page.match(/20\d\d/) || [0])[0];
  const played = ts.filter(t => t.rows.some(r => r.p > 0));
  const best = Math.max(0, ...(played.length ? played : ts).map(yr));
  const pick = ts.filter(t => yr(t) === best);
  const pages = new Set(pick.map(t => t.page));
  return pick.map(t => ({ ...t, label: [/Women/.test(t.page) ? "Women's" : /Wheelchair/.test(t.page) ? 'Wheelchair' : pages.size > 1 && /Men's/.test(t.page) ? "Men's" : '', t.title].filter(Boolean).join(' · ') || 'Standings' }));
}
function tableHtml(t) {
  const cols = t.style === 'points' ? [['pts', 'Pts']] : t.style === 'cricket' ? [['p', 'P'], ['w', 'W'], ['l', 'L'], ['nr', 'NR'], ['nrr', 'NRR'], ['pts', 'Pts']]
    : t.style === 'rugby' ? [['p', 'P'], ['w', 'W'], ['d', 'D'], ['l', 'L'], ['f', 'PF', 'wide'], ['a', 'PA', 'wide'], ['diff', '+/−'], ['bp', 'BP'], ['pts', 'Pts']]
    : [['p', 'P'], ['w', 'W'], ['d', 'D'], ['l', 'L'], ['f', t.sport === 'football' ? 'GF' : 'PF', 'wide'], ['a', t.sport === 'football' ? 'GA' : 'PA', 'wide'], ['diff', t.sport === 'football' ? 'GD' : '+/−'], ['pts', 'Pts']];
  const ev = { sport: t.sport, comp: t.comp, team: t.team };
  const logos = {};
  for (const e of FEED.events || []) if (compOf(e) === compSel) { if (e.homeLogo) logos[e.home] = e.homeLogo; if (e.awayLogo) logos[e.away] = e.awayLogo; }
  const rows = t.rows.map((r, i) => {
    const diff = r.f - r.a;
    const v = k => k === 'diff' ? (diff > 0 ? '+' + diff : String(diff)) : k === 'nrr' ? (r.nrr || '–') : r[k];
    const mine = picked.has(Object.keys(TEAM_NAME).find(k => TEAM_NAME[k] === r.name)) || NZ_NAMES.test(r.name) || r.nz;
    return `<tr class="${r.q ? 'q' : ''} ${mine ? 'mine' : ''}"><td class="pos">${i + 1}</td><td class="tn">${teamName(/Women/.test(t.page) ? r.name.replace(/\s+Women('s)?$/, '') : r.name, logos[r.name] || '', ev)}${r.champ ? ' <span class="tag">Champions</span>' : ''}</td>${cols.map(([k, , c]) => `<td class="num ${c || ''} ${k === 'pts' ? 'pts' : ''}">${esc(String(v(k)))}</td>`).join('')}</tr>`;
  }).join('');

}

    const img = n.image && !hide ? `<img class="thumb" src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
    return `<article class="ni sport-${sport} ${img ? 'has-img' : ''}">${img}<div class="ni-body">
      <div class="top">${badge(n.team)}<span class="kind ${n.kind}">${esc(n.kind === 'news' ? 'News' : n.kind)}</span><span>${esc(TEAM_NAME[n.team] || '')}</span><span class="num">${fmt(new Date(n.date + 'T12:00:00+13:00'), NZ, { day: 'numeric', month: 'short' })}</span><span>${esc(n.source || '')}</span></div>
      ${hide ? `<button class="cover" type="button" data-reveal="n:${esc(n.id)}"><b>Result story hidden</b>tap to show</button>`
        : `<h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p>${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">Read at ${esc(n.source || 'source')}</a>` : ''}`}
    </div></article>`;
  }).join('') : `<div class="empty-note">No news in this category for your teams.</div>`;

  // controls
  {
    // every competition with games in the last two months or next four; ones on now first, then by next game
    const counts = new Map(), sportOfComp = new Map(), nextOf = new Map();
    (FEED.events || []).filter(e => { const t = new Date(e.startUTC) - now; return t > -60 * 864e5 && t < 120 * 864e5; }).forEach(e => {
      const c = compOf(e), t = new Date(e.startUTC) - now;
      counts.set(c, (counts.get(c) || 0) + 1); sportOfComp.set(c, e.sport || sportOf(e.team));
      nextOf.set(c, Math.min(nextOf.get(c) ?? Infinity, t > -3 * 36e5 ? t : Infinity));
    });
    const rank = c => (onNowComps.has(c) ? 0 : nextOf.get(c) < Infinity ? 1 : 2);
    const hasTable = new Set((FEED.tables || []).map(t => compOf({ comp: t.comp, sport: t.sport, team: t.team })));
    const comps = [...counts].filter(([c, n]) => n >= 2 || nextOf.get(c) < Infinity || hasTable.has(c) || c === compSel).map(([c]) => c)
      .sort((a, b) => rank(a) - rank(b) || (nextOf.get(a) - nextOf.get(b)) || a.localeCompare(b));
    const groups = [[['rugby'], 'Rugby'], [['league'], 'Rugby league'], [['cricket'], 'Cricket'], [['football'], 'Football'], [['motor'], 'Motorsport'], [['mma', 'boxing'], 'Fighting']];
    const opt = c => `<button type="button" role="option" class="copt" data-comp="${esc(c)}" aria-selected="${c === compSel}">${esc(COMP_LABEL[c] || c)}${liveComps.has(c) ? '<span class="onnow">Live</span>' : onNowComps.has(c) ? '<span class="current">Current</span>' : !c || nextOf.get(c) < Infinity ? '' : '<span class="ended">Season over</span>'}</button>`;
    $('compMenu').innerHTML = opt('') .replace('></button>', '>All competitions</button>') + groups.map(([ks, l]) => {
      const cs = comps.filter(c => ks.includes(sportOfComp.get(c))).sort((a, b) => ks.indexOf(sportOfComp.get(a)) - ks.indexOf(sportOfComp.get(b)));
      if (!cs.length) return '';
      // subheadings: MMA and Boxing under Fighting; International and Leagues within each team sport
      const subs = ks.length > 1 ? ks.map(k => [k === 'mma' ? 'MMA' : 'Boxing', cs.filter(c => sportOfComp.get(c) === k)])
        : [['International', cs.filter(c => !DOMESTIC.test(c))], ['Leagues', cs.filter(c => DOMESTIC.test(c))]];
      const live = subs.filter(([, list]) => list.length);
      const body = ks.length > 1 || live.length > 1 ? live.map(([h, list]) => `<div class="csub">${h}</div>${list.map(opt).join('')}`).join('') : cs.map(opt).join('');
      return `<div class="cgroup"><div class="chead"><span class="dot" style="background:var(--${ks[0]})"></span>${l}</div>${body}</div>`;
    }).join('');
    $('compSel').textContent = COMP_LABEL[compSel] || compSel || 'All competitions';
    $('nzOnly').setAttribute('aria-pressed', String(nzOnly));
    renderHub(now);
    $('compSel').classList.toggle('on', !!compSel);
    $('genderSel').innerHTML = [['all', 'All'], ['m', "Men's"], ['w', "Women's"]].map(([k, l]) => `<button type="button" data-gender="${k}" aria-pressed="${genderSel === k}">${l}</button>`).join('');
    $('sportFilter').classList.toggle('dim', !!compSel);
  }
  $('sportFilter').innerHTML = [['all','All'],['rugby','Rugby'],['cricket','Cricket'],['league','League'],['football','Football'],['motor','F1'],['mma','MMA'],['boxing','Boxing']].map(([k, l]) => `<button type="button" data-sport="${k}" aria-pressed="${sportSel === k}" class="chip sportchip sport-${k}">${sIcon(k, 'cicon')}${l}</button>`).join('');
  document.body.classList.remove('v-big', 'v-mixed', 'v-compact');
  document.body.classList.add('v-' + view);
  $('viewSel').innerHTML = [['big', 'Big'], ['mixed', 'Mixed'], ['compact', 'Compact']].map(([k, l]) => `<button type="button" data-view="${k}" aria-pressed="${view === k}">${l}</button>`).join('');
  $('spoilBtn').setAttribute('aria-pressed', String(!spoilers));
  $('spoilBtn').textContent = spoilers ? 'Spoilers hidden' : 'Spoilers shown';
  $('teamsBtn').textContent = `My teams (${picked.size})`;
  $('spoilDays').value = String(spoilDays);
  $('teamGroups').innerHTML = TEAMS.map(g => `<div class="group"><h3>${g.g}</h3><div class="chips">${g.items.map(([k, l]) => `<button class="chip" type="button" data-team="${k}" aria-pressed="${picked.has(k)}">${badge(k)}${l}</button>`).join('')}</div></div>`).join('');
}
const SPORT = { rugby: ['allblacks','blackferns','npc','fpc','blues','chiefs','hurricanes','crusaders','highlanders','moana','wallabies','aurugby','superrugby'], cricket: ['blackcaps','whiteferns','nzdomestic','bbl','wbbl','aucricket'], league: ['kiwis','kiwiferns','warriors','nrl','rlwc'], football: ['phoenix','aucklandfc','aleague','epl'], mma: ['ufc'], boxing: ['boxing','nzboxing'], motor: ['f1'] };
const sportOf = t => Object.keys(SPORT).find(s => SPORT[s].includes(t)) || 'rugby';

function tick() { $('clock').textContent = `NZ ${fmt(new Date(), NZ, { weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true })}` }

document.addEventListener('click', ev => {
  if (ev.target.closest('a')) return;
  const t = ev.target.closest('button');
  if (!t) { const card = ev.target.closest('[data-open]'); if (card) openDetail(card.dataset.open); else if (ev.target === $('sheet')) $('sheet').close(); return; }
  if (t.id === 'sheetClose') { $('sheet').close(); return; }
  if (t.dataset.team) { const k = t.dataset.team; picked.has(k) ? picked.delete(k) : picked.add(k); store.set('teams', [...picked]); render(); }
  else if (t.dataset.reveal) { ev.stopPropagation(); revealed.add(t.dataset.reveal); store.set('revealed', [...revealed]); render(); if ($('sheet').open) openDetail($('sheet').dataset.id); }
  else if (t.dataset.rehide) { ev.stopPropagation(); revealed.delete(t.dataset.rehide); store.set('revealed', [...revealed]); render(); if ($('sheet').open) openDetail($('sheet').dataset.id); }
  else if (t.dataset.gender) { genderSel = t.dataset.gender; store.set('gender', genderSel); render(); }
  else if (t.dataset.sport) { compSel = ''; store.set('comp', ''); sportSel = t.dataset.sport; store.set('sport', sportSel); render(); }
  else if (t.dataset.kind) { newsKind = t.dataset.kind; render(); }
  else if (t.dataset.jump) { selDay = selDay === t.dataset.jump || t.dataset.jump === dayKey(new Date()) ? '' : t.dataset.jump; drawDayPick(); }
  else if (t.dataset.bigcomp) {
    const again = compSel === t.dataset.bigcomp && t.classList.contains('nowchip');
    hubTab = 'games'; compSel = again ? '' : t.dataset.bigcomp; store.set('comp', compSel); render();
    if (!t.classList.contains('nowchip')) $('sportFilter').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  else if (t.dataset.hubtab) { hubTab = t.dataset.hubtab; render(); }
  else if (t.id === 'hubClose') { compSel = ''; store.set('comp', ''); hubTab = 'games'; render(); }
  else if (t.id === 'toTop') { scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  else if (t.id === 'moreUp') { store.set('showAllUp', true); render(); }
  else if (t.dataset.view) { view = t.dataset.view; store.set('view', view); render(); }
  else if (t.id === 'spoilBtn') { spoilers = !spoilers; store.set('spoilers', spoilers); render(); }
  else if (t.id === 'teamsBtn') { const p = $('panel'); p.hidden = !p.hidden; t.setAttribute('aria-expanded', String(!p.hidden)); }
  else if (t.id === 'allOn') { picked = new Set(ALL_KEYS); store.set('teams', ALL_KEYS); render(); }
  else if (t.id === 'allOff') { picked = new Set(); store.set('teams', []); render(); }
});
document.addEventListener('keydown', ev => { const c = ev.target.closest?.('[data-open]'); if (c && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openDetail(c.dataset.open); } });
function closeComp() { $('compMenu').hidden = true; $('compSel').setAttribute('aria-expanded', 'false'); }
// the menu runs down to just above the bottom of the window, so bigger windows show more of it
const fitComp = () => { const m = $('compMenu'); if (!m.hidden) m.style.maxHeight = Math.max(220, innerHeight - $('compSel').getBoundingClientRect().bottom - 24) + 'px'; };
$('compSel').addEventListener('click', ev => { ev.stopPropagation(); const open = $('compMenu').hidden; $('compMenu').hidden = !open; $('compSel').setAttribute('aria-expanded', String(open)); fitComp(); });
addEventListener('resize', fitComp);
$('compMenu').addEventListener('click', ev => { const b = ev.target.closest('[data-comp]'); if (!b) return; ev.stopPropagation(); compSel = b.dataset.comp; store.set('comp', compSel); closeComp(); render(); });
document.addEventListener('click', ev => { if (!ev.target.closest('.cmenu')) closeComp(); }, true);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeComp(); });
addEventListener('scroll', () => { $('toTop').hidden = scrollY < 700; }, { passive: true });
$('nzOnly').addEventListener('click', ev => { ev.stopPropagation(); nzOnly = !nzOnly; store.set('nzOnly', nzOnly); render(); });
$('spoilDays').addEventListener('change', e => { spoilDays = +e.target.value; store.set('spoilDays', spoilDays); store.set('spoilDaysSet', true); render(); });

function stamp() {
  if (!FEED.generatedAt) return;
  const mins = Math.round((Date.now() - new Date(FEED.generatedAt)) / 6e4);
  if (FEED.site) { $('ver').textContent = `v${FEED.site.version}`; $('ver').title = `Site last changed ${fmt(new Date(FEED.site.changedAt), NZ, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true })}`; }
  $('mockNote').textContent = (FEED.site ? `Site v${FEED.site.version}, changed ${fmt(new Date(FEED.site.changedAt), NZ, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true })}. ` : '') + `Results updated ${mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : fmt(new Date(FEED.generatedAt), NZ, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true })}. Results update about every 10 minutes.`;
}
async function load() {
  try {
    const r = await fetch('data/feed.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    FEED = await r.json();
    $('foot').innerHTML = `Sources: ${(FEED.sources || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ')} · Icons: <a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a> (CC BY 4.0)`;
    render(); stamp();
  } catch (e) {
    if (!FEED.generatedAt) $('mockNote').textContent = 'Could not load the feed. Check your connection and refresh the page.';
  }
}
tick(); render(); load();
setInterval(() => { tick(); render(); stamp(); }, 60000);
setInterval(load, 5 * 60000);
})();
</script>

</body>
</html>
