<style>
/* Layout: sticky scoreboard header, week strip, then one column of day-grouped fixture rows, results and news. */
:root {
  --paper: #f3f6f4; --surface: #ffffff; --ink: #14211c; --muted: #5a6a64; --line: #d9e2de;
  --accent: #0d6b4d; --accent-ink: #ffffff; --soft: #e6efeb;
  --rugby: #17704f; --cricket: #1d5ea6; --league: #b0521a; --football: #6741d9; --mma: #a61e4d; --boxing: #9c6500;
  --live: #c8322a; --cover: #dfe6e3;
  --soon: #d9480f; --near: #7048e8; --later: #5a6a64; --local: #1971c2;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1412; --surface: #161f1c; --ink: #e6eeea; --muted: #93a49d; --line: #25322d;
  --accent: #46c093; --accent-ink: #08130f; --soft: #1c2925;
  --rugby: #46c093; --cricket: #7fb1ef; --league: #f09c62; --football: #b197fc; --mma: #f783ac; --boxing: #ffc95e;
  --live: #ff6b5f; --cover: #25322d; --soon: #ff8a4c; --near: #a98bff; --later: #93a49d; --local: #74b9ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0e1412; --surface: #161f1c; --ink: #e6eeea; --muted: #93a49d; --line: #25322d;
  --accent: #46c093; --accent-ink: #08130f; --soft: #1c2925;
  --rugby: #46c093; --cricket: #7fb1ef; --league: #f09c62; --football: #b197fc; --mma: #f783ac; --boxing: #ffc95e;
  --live: #ff6b5f; --cover: #25322d; --soon: #ff8a4c; --near: #a98bff; --later: #93a49d; --local: #74b9ff; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0 }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; line-height: 1 }
.brand span { color: var(--accent) }
.clock { color: var(--muted); font-size: 13px }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: center }
.btn:hover { border-color: var(--accent) }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }

.mock { background: var(--soft); color: var(--muted); font-size: 13px }
.mock .wrap { padding-block: 8px }

.panel { background: var(--surface); border-bottom: 1px solid var(--line) }
.panel .wrap { padding-block: 16px; display: grid; gap: 14px }
.group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--f-body); font-weight: 700; margin-bottom: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 14px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.spoil-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px }
select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink) }

main { padding-block: 18px 48px; display: grid; gap: 28px }
section > h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .04em; display: flex; flex-wrap: wrap; column-gap: 10px; align-items: baseline; gap: 10px; margin-bottom: 10px }
section > h2 small { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--muted); font-weight: 400 }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 4px; text-align: center; cursor: pointer; display: grid; gap: 2px; min-width: 0 }
.day:hover { border-color: var(--accent) }
.day .dn { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.day .dd { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1 }
.day .dots { display: flex; gap: 3px; justify-content: center; min-height: 8px; flex-wrap: wrap }
.dot { width: 7px; height: 7px; border-radius: 50% }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.day.empty .dd { color: var(--muted) }

.daygroup { display: grid; gap: 8px }
.daygroup + .daygroup { margin-top: 14px }
.dayhead { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); scroll-margin-top: 80px }

.ev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; overflow: hidden }
.ev .stripe { background: var(--sport) }
.ev .body { padding: 10px 12px; min-width: 0; display: grid; gap: 2px }
.ev .comp { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--sport); font-weight: 700 }
.ev .teams { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.15 }
.ev .teams .v { color: var(--muted); font-weight: 500; padding-inline: 4px }
.ev .meta { font-size: 13px; color: var(--muted) }
.watch { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; margin-top: 4px }
.watch .wl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; border: 1px solid var(--sport); color: var(--sport); border-radius: 4px; padding: 0 5px }
.watch .alt { font-weight: 600 }
.watch .muted { color: var(--muted) }
.ev .when { padding: 10px 12px; text-align: right; display: grid; align-content: center; gap: 2px; border-left: 1px dashed var(--line); min-width: 112px }
.ev .nz { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1 }
.ev .nzl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.ev .loc { font-size: 12px; color: var(--muted) }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: var(--soft); color: var(--ink); justify-self: end }
.tag.live { background: var(--live); color: #fff }
.sport-rugby { --sport: var(--rugby) } .sport-cricket { --sport: var(--cricket) } .sport-league { --sport: var(--league) } .sport-football { --sport: var(--football) } .sport-mma { --sport: var(--mma) } .sport-boxing { --sport: var(--boxing) }

.res .when { min-width: 120px }
.res .score { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1 }
.res .score.long { font-size: 15px; font-family: var(--f-body); font-weight: 600; line-height: 1.3 }
.res .summary { font-size: 14px; margin-top: 2px }
.cover { background: var(--cover); border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; text-align: center; line-height: 1.25 }
.cover b { display: block; font-size: 14px }

.news { display: grid; gap: 8px }
.ni { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 3px }
.ni .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.kind { text-transform: uppercase; letter-spacing: .07em; font-weight: 700; font-size: 11px; border-radius: 4px; padding: 1px 5px; background: var(--soft); color: var(--ink) }
.kind.injury { background: var(--live); color: #fff }
.ni h3 { font-family: var(--f-body); font-size: 16px; font-weight: 700; line-height: 1.3 }
.ni p { margin: 0; font-size: 14px; color: var(--muted); max-width: 68ch }
.ni a { color: var(--accent); font-size: 13px }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px }
.empty-note { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px }
.more { justify-self: start }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px }
footer a { color: var(--muted) }


.badge { display: inline-grid; place-items: center; min-width: 30px; height: 18px; padding: 0 4px; border-radius: 4px; font: 700 10px/1 var(--f-body); letter-spacing: .03em; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent); flex: none }
.ev .comp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px }
.sp { background: var(--sport); color: var(--paper); border-radius: 4px; padding: 1px 6px; font-size: 10px; letter-spacing: .08em }
.logo { width: 1.1em; height: 1.1em; object-fit: contain; vertical-align: -0.15em; margin-right: 5px }
.flag { margin-right: 5px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif }
.chip { display: inline-flex; align-items: center; gap: 6px }
.sportchip.sport-all { --sport: var(--ink) }
.sportchip { border-color: var(--sport) }
.sportchip[aria-pressed="true"] { background: var(--sport); border-color: var(--sport); color: var(--paper) }
.sport-rugby .ev, .ev.sport-rugby { background: color-mix(in srgb, var(--rugby) 5%, var(--surface)) }
.ev.sport-cricket { background: color-mix(in srgb, var(--cricket) 5%, var(--surface)) }
.ev.sport-league { background: color-mix(in srgb, var(--league) 6%, var(--surface)) }
.ev.sport-football { background: color-mix(in srgb, var(--football) 6%, var(--surface)) }
.ev.sport-boxing { background: color-mix(in srgb, var(--boxing) 6%, var(--surface)) }
.ev.sport-mma { background: color-mix(in srgb, var(--mma) 6%, var(--surface)) }
.ev .stripe { width: 6px }
.ni .top .badge { margin-right: 2px }
#sportFilter { margin-bottom: -10px; justify-content: center }
#newsFilters { justify-content: center }


.ev .nz { color: var(--sport) }
.ev .date { font-size: 13px; font-weight: 700; color: var(--ink) }
.ev .loc { color: var(--local) }
.tag.soon { background: var(--soon); color: #fff }
.tag.near { background: var(--near); color: #fff }
.tag.later { background: transparent; color: var(--later); box-shadow: inset 0 0 0 1px var(--line) }
.dayhead { color: var(--ink) }
.dayhead::after { content: ""; display: block; height: 2px; width: 32px; background: var(--accent); margin-top: 4px; border-radius: 2px }


.ev[data-open] { cursor: pointer }
.ev .nz.longsc { font-family: var(--f-body); font-size: 15px; line-height: 1.3 }
.rehide { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 2px 0; justify-self: end }
.dres .rehide { justify-self: start }
.livelink { font-size: 13px; font-weight: 700; color: var(--live); text-decoration: none; justify-self: end }
.livelink:hover { text-decoration: underline }
.ev .tv { color: var(--ink); font-weight: 600 }
dialog#sheet { border: 0; padding: 0; margin: auto auto 0; width: min(640px, 100%); max-height: 88vh; border-radius: 16px 16px 0 0; background: var(--surface); color: var(--ink); box-shadow: 0 -8px 40px rgba(0,0,0,.25) }
@media (min-width: 700px) { dialog#sheet { margin: auto; border-radius: 16px } }
dialog#sheet::backdrop { background: rgba(10, 18, 15, .5) }
.sheet-in { padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; overflow-y: auto; max-height: 88vh }
.close { justify-self: end; position: sticky; top: 0 }
.sheet-head { display: grid; gap: 6px; border-left: 5px solid var(--sport); padding-left: 12px }
.sheet-head .comp { display: flex; gap: 6px; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--sport); font-weight: 700 }
.dteams { font-size: 28px; line-height: 1.1 }
.dteams .v { color: var(--muted); font-weight: 500 }
.sheet-head .tag { justify-self: start }
.dres { display: grid; gap: 4px; background: var(--paper); border-radius: 10px; padding: 10px 12px }
.dres .score { font-family: var(--f-display); font-size: 30px; font-weight: 700 }
.dres p { margin: 0 }
.cover.big { padding: 14px; font-size: 14px }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px }
.facts dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px }
.facts dd { margin: 0 }
.dh { font-family: var(--f-body); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 4px }
.watchlist { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px }
.muted { color: var(--muted) }
.dn-item { display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.35 }
.dn-item:hover { border-color: var(--accent) }
.srclink { color: var(--accent); font-size: 14px }


.ni.has-img { grid-template-columns: 96px minmax(0, 1fr); column-gap: 12px; align-items: start }
.ni-body { display: grid; gap: 3px; min-width: 0 }
.thumb { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--soft) }
.thumb.sm { width: 56px; height: 42px; float: left; margin-right: 10px }
.dn-item::after { content: ""; display: block; clear: both }
@media (max-width: 420px) { .ni.has-img { grid-template-columns: 72px minmax(0, 1fr) } .thumb { width: 72px; height: 56px } }

/* detail sheet spacing */
.sheet-in { display: block; padding-top: 22px }
.sheet-in > div > * + *, .sheet-in > div + div { margin-top: 18px }
#sheetBody { display: flow-root }
dialog#sheet { width: min(720px, 100%) }
.close { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; z-index: 2 }
.close:hover { color: var(--ink); border-color: var(--ink) }
.sheet-in { position: relative }
.sheet-head { padding-right: 40px; gap: 8px }
.dres { padding: 14px 16px; gap: 8px; justify-items: start }
.facts { gap: 10px 18px; padding-block: 4px }
.dh { margin-bottom: 8px }
.watchlist { gap: 6px }
.news { gap: 10px }
.dn-item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px }
.dn-item .thumb.sm { float: none; width: 64px; height: 48px; margin: 0 }
.dn-text { display: grid; gap: 4px; min-width: 0 }
.dn-meta { display: flex; gap: 8px; align-items: center; font-size: 12px }
.dn-item .kind { justify-self: start }

/* tighter cards, less dead space on wide screens */
.wrap { max-width: 1120px }
.ev .body { padding: 9px 12px; gap: 3px }
.ev .when { padding: 9px 14px; gap: 1px; min-width: 128px }
.ev .nzl { font-size: 10px }
.ev .nz { font-size: 22px }
.ev .teams { font-size: 20px }
.flagimg { width: 1.25em; height: auto; border-radius: 2px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 15%, transparent); vertical-align: -0.08em }

/* on now: red ring with a soft pulse; starting within 3 hours: orange ring */
.ev.is-live { border-color: var(--live); box-shadow: 0 0 0 2px var(--live), 0 0 28px 4px color-mix(in srgb, var(--live) 50%, transparent) }
.ev.is-soon { border-color: var(--soon); box-shadow: 0 0 0 2px var(--soon), 0 0 24px 3px color-mix(in srgb, var(--soon) 42%, transparent) }
@media (prefers-reduced-motion: no-preference) {
  .ev.is-live { animation: livepulse 2.4s ease-in-out infinite }
  @keyframes livepulse { 50% { box-shadow: 0 0 0 2px var(--live), 0 0 10px 1px color-mix(in srgb, var(--live) 25%, transparent) } }
}

.compbar { display: flex; justify-content: center; margin-top: 2px }
#compSel { border-radius: 999px; padding: 5px 14px; font-size: 14px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; max-width: 100% }
#compSel.on { background: var(--ink); color: var(--paper); border-color: var(--ink) }
#sportFilter.dim .chip[aria-pressed="true"] { background: transparent; color: var(--ink) }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

/* bigger time, names and logos */
.ev .nz { font-size: 30px }
.ev .teams { font-size: 28px; line-height: 1.2 }
.ev .teams .logo { width: 1.6em; height: 1.6em; margin-right: 8px; vertical-align: -0.45em }
.ev .teams .flagimg { width: 1.5em; height: auto; vertical-align: -0.12em }
.ev .when { min-width: 140px }

/* venue + channel sit in the bottom-left corner */
.ev .body { display: flex; flex-direction: column; gap: 4px }
.ev:not(.res) .body > .meta:last-child { margin-top: auto; padding-top: 8px }

/* centred matchup: Home  v  Away, crests next to the v */
.ev .teams.matchup { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 12px; flex: 1; padding-block: 6px }
.ev .teams.matchup { align-items: start }
.matchup .v { align-self: center }
.matchup .side { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center }
.matchup .nm { min-width: 0; overflow-wrap: anywhere; text-wrap: balance }
.matchup .away .logo { order: -1 }
.ev .teams.matchup .logo, .ev .teams.matchup .logo.after { margin: 0; flex: none; width: 2.1em; height: 2.1em; vertical-align: 0; object-fit: contain }
.ev .teams.matchup .flagimg, .ev .teams.matchup .flagimg.after { width: 2.2em; height: auto; margin-block: .2em; border-radius: 3px }
.nm[style] { color: color-mix(in oklab, var(--tc) 82%, var(--ink)) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nm[style] { color: color-mix(in oklab, var(--tc) 55%, var(--ink)) } }
:root[data-theme="dark"] .nm[style] { color: color-mix(in oklab, var(--tc) 55%, var(--ink)) }
/* same right-column width on every card so the "v" lines up down the page */
@media (min-width: 561px) { .ev { grid-template-columns: 6px minmax(0, 1fr) 210px } .ev .when { min-width: 0 } }
.matchup .v { padding: 0; font-size: 0.75em; text-transform: lowercase }
.ev .teams .logo.after { margin: 0 0 0 8px }
/* competition menu with its own arrow */
#compSel { appearance: none; -webkit-appearance: none; padding: 6px 36px 6px 16px; text-align: center; text-align-last: center;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 17px center, right 12px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; min-width: 200px }
#compSel option { color: var(--ink); background: var(--surface) }

.compbar { gap: 10px; flex-wrap: wrap; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 6px 14px; font-size: 14px; cursor: pointer; color: var(--muted) }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper) }

.donetoday { display: grid; gap: 10px }
.donetoday .ev { background: color-mix(in srgb, var(--muted) 10%, var(--paper)); border-style: dashed; filter: saturate(.45) }

<body>

    <div class="spacer"></div>

  </div>

<div class="mock"><div class="wrap" id="mockNote">Loading the latest fixtures and scores…</div></div>
<div class="panel" id="panel" hidden>

        <option value="5">5 days</option><option value="7">7 days</option>

</div>

<main class="wrap">

  <div class="compbar"><label for="compSel" class="visually-hidden">Competition</label><select id="compSel"></select><div class="seg" id="genderSel" role="group" aria-label="Men's or women's"></div></div>
  <section id="weekSec">

  <section id="todaySec">

    <div id="today"></div>
  </section>
  <section id="upSec">
    <h2>Coming up <small>Times in NZ, with local time for overseas games</small></h2>
    <div id="upcoming"></div>
  </section>
  <section id="resSec">
    <h2>Results</h2>
    <div id="results"></div>
  </section>
  <section id="newsSec">
    <h2>News &amp; injuries</h2>
    <div class="filters" id="newsFilters"></div>
    <div id="news" class="news"></div>
  </section>
</main>
<footer class="wrap" id="foot"></footer>
<dialog id="sheet" aria-label="Match details">
  <div class="sheet-in">
    <button class="close" id="sheetClose" type="button" aria-label="Close">×</button>
    <div id="sheetBody"></div>
  </div>
</dialog>

<script>
(() => {
let FEED = { events: [], news: [], sources: [] };
const NZ = 'Pacific/Auckland';
const TEAMS = [
  { g: 'Rugby', items: [['allblacks','All Blacks'],['blackferns','Black Ferns'],['npc','NPC'],['fpc','Farah Palmer Cup'],['wallabies','Wallabies']] },
  { g: 'Super Rugby Pacific', items: [['blues','Blues'],['chiefs','Chiefs'],['hurricanes','Hurricanes'],['crusaders','Crusaders'],['highlanders','Highlanders'],['moana','Moana Pasifika'],['aurugby','Australian teams'],['superrugby','Every game']] },
  { g: 'Cricket', items: [['blackcaps','Black Caps'],['whiteferns','White Ferns'],['nzdomestic','Domestic cricket'],['bbl','Big Bash'],['wbbl','Women\'s Big Bash']] },
  { g: 'Rugby league', items: [['kiwis','Kiwis'],['kiwiferns','Kiwi Ferns'],['warriors','Warriors'],['nrl','NRL (every game)'],['rlwc','League World Cup (every game)']] },
  { g: 'Football', items: [['phoenix','Wellington Phoenix'],['aucklandfc','Auckland FC'],['aleague','A-League Men (every game)']] },
  { g: 'Fight sports', items: [['ufc','UFC events'],['boxing','Major boxing'],['nzboxing','NZ boxers']] },
];
const TEAM_NAME = Object.fromEntries(TEAMS.flatMap(g => g.items));
// team badges (colours + short code) and country flags
const BADGE = {
  allblacks: ['AB', '#000000', '#ffffff'], blackferns: ['BF', '#000000', '#ffffff'], npc: ['NPC', '#c8102e', '#ffffff'], fpc: ['FPC', '#6d2077', '#ffffff'],
  blues: ['BLU', '#0b3d91', '#ffffff'], chiefs: ['CHI', '#d6001c', '#ffd200'], hurricanes: ['HUR', '#ffcd00', '#000000'], crusaders: ['CRU', '#c8102e', '#000000'],
  highlanders: ['HIG', '#1d2f6f', '#f2a900'], moana: ['MP', '#00807f', '#ffffff'],
  blackcaps: ['BC', '#111111', '#7fe0d0'], whiteferns: ['WF', '#ffffff', '#111111'], nzdomestic: ['NZC', '#2b3a67', '#ffffff'],
  wallabies: ['WAL', '#f2c200', '#0b3d2e'], aurugby: ['AUS', '#0b3d91', '#f2c200'], superrugby: ['SRP', '#00205b', '#ffffff'],
  bbl: ['BBL', '#ff6b00', '#111111'], wbbl: ['WBBL', '#7b2cbf', '#ffffff'], nrl: ['NRL', '#003b7a', '#ffffff'], rlwc: ['RLWC', '#0b6e4f', '#ffffff'],
  phoenix: ['WNP', '#ffd100', '#000000'], aucklandfc: ['AFC', '#0033a0', '#ffffff'], aleague: ['ALM', '#e4002b', '#ffffff'], ufc: ['UFC', '#d20a0a', '#ffffff'], boxing: ['BOX', '#8a1c1c', '#ffd43b'], nzboxing: ['NZB', '#000000', '#ffd43b'],
  kiwis: ['KIW', '#000000', '#ffffff'], kiwiferns: ['KF', '#000000', '#ffffff'], warriors: ['WAR', '#0d1f4c', '#7fd13b'],
};
const badge = k => { const b = BADGE[k]; return b ? `<span class="badge" style="background:${b[1]};color:${b[2]}" aria-hidden="true">${b[0]}</span>` : ''; };
const FLAGS = {
  'New Zealand': '🇳🇿', 'All Blacks': '🇳🇿', 'Black Ferns': '🇳🇿', Australia: '🇦🇺', Wallabies: '🇦🇺', England: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', Scotland: '🏴󠁧󠁢󠁳󠁣󠁴󠁿',
  Wales: '🏴󠁧󠁢󠁷󠁬󠁳󠁿', Ireland: '🇮🇪', France: '🇫🇷', Italy: '🇮🇹', 'South Africa': '🇿🇦', Argentina: '🇦🇷', Japan: '🇯🇵', Fiji: '🇫🇯',
  Samoa: '🇼🇸', Tonga: '🇹🇴', 'Papua New Guinea': '🇵🇬', 'Cook Islands': '🇨🇰', India: '🇮🇳', 'Sri Lanka': '🇱🇰', Bangladesh: '🇧🇩',
  Pakistan: '🇵🇰', 'West Indies': '🌴', Canada: '🇨🇦', USA: '🇺🇸', 'United States': '🇺🇸',
};
// flag emoji don't render on Windows, so use small flag images (flagcdn.com) keyed by ISO code
const ISO = { 'New Zealand': 'nz', 'All Blacks': 'nz', 'Black Ferns': 'nz', Australia: 'au', Wallabies: 'au', England: 'gb-eng', Scotland: 'gb-sct',
  Wales: 'gb-wls', Ireland: 'ie', France: 'fr', Italy: 'it', 'South Africa': 'za', Argentina: 'ar', Japan: 'jp', Fiji: 'fj', Samoa: 'ws', Tonga: 'to',
  'Papua New Guinea': 'pg', 'Cook Islands': 'ck', India: 'in', 'Sri Lanka': 'lk', Bangladesh: 'bd', Pakistan: 'pk', Lebanon: 'lb', Canada: 'ca',

const flagOf = name => {
  const base = String(name || '').replace(/\s+(Women|A|XI|U\d+|Wheelchair)$/i, '').trim();
  const c = ISO[base];
  return c ? `https://flagcdn.com/w40/${c}.png` : '';
};
// away side: name first, then logo/flag, so both crests sit beside the "v"
// "Wellington Phoenix FC" -> "Wellington Phoenix"; keeps short names like "Auckland FC"
const shortName = n => n.split(' ').length > 2 ? n.replace(/\s+FC$/, '') : n;
const crest = (n, logo, after) => {
  const src = logo || flagOf(n);

};
// National side nicknames by sport and men's/women's, e.g. New Zealand cricket (men's) -> Black Caps
const NICK = {
  'rugby m': { 'New Zealand': 'All Blacks', Australia: 'Wallabies', 'South Africa': 'Springboks', Argentina: 'Pumas', Fiji: 'Flying Fijians', Samoa: 'Manu Samoa' },
  'rugby w': { 'New Zealand': 'Black Ferns', Australia: 'Wallaroos', England: 'Red Roses', Fiji: 'Fijiana' },
  'league m': { 'New Zealand': 'Kiwis', Australia: 'Kangaroos', 'Papua New Guinea': 'PNG Kumuls', Samoa: 'Toa Samoa', Fiji: 'Fiji Bati' },
  'league w': { 'New Zealand': 'Kiwi Ferns', Australia: 'Jillaroos', 'Papua New Guinea': 'PNG Orchids', Fiji: 'Fiji Bulikula' },
  'cricket m': { 'New Zealand': 'Black Caps' },
  'cricket w': { 'New Zealand': 'White Ferns' },
};
const plural = t => /A-League/.test(t || '') ? t : String(t || '').replace(/\bWomen\b(?!')/g, "Women's").replace(/\bMen\b(?!')/g, "Men's");
function displayName(n, e) {
  if (!n) return '';
  const base = n.replace(/\s+Women('s)?$/, '');
  const g = e ? (/\s+Women('s)?$/.test(n) ? 'w' : genderOf(e)) : '';
  const nick = e && NICK[`${e.sport} ${g}`]?.[base];
  return nick || plural(shortName(n));
}
// Name colours: national and club colours. New Zealand / black teams stay the default ink.
const TEAM_COLOR = {
  Australia: '#00843d', Wallabies: '#c99700', Fiji: '#1b75bb', Samoa: '#0b3d91', Tonga: '#c8102e', 'Papua New Guinea': '#c8102e', 'Cook Islands': '#0a7d3b',
  England: '#c8102e', Wales: '#d30731', Scotland: '#1d3a7a', Ireland: '#169b62', France: '#1d3c87', Italy: '#1f5fbf', 'South Africa': '#007a4d', Argentina: '#4a9fd8',
  Japan: '#c8102e', USA: '#1d3c87', Lebanon: '#c8102e', India: '#1f6fd6', Pakistan: '#01411c', 'Sri Lanka': '#1f3a93', Bangladesh: '#006a4e', 'West Indies': '#7b1e3a', Afghanistan: '#1f5fbf', Zimbabwe: '#c8102e',
  Blues: '#1f4fa3', Chiefs: '#b8001f', Hurricanes: '#c99700', Crusaders: '#c8102e', Highlanders: '#1d3a7a', Moana: '#0e7c86', Brumbies: '#0b3d91', Reds: '#c8102e', Waratahs: '#4a9fd8', 'Western Force': '#1d3a7a', Drua: '#1b75bb',
  Warriors: '#5a6f7d', Broncos: '#7a1f3d', Dolphins: '#c8102e', Knights: '#1d3c87', Storm: '#5b2a86', Roosters: '#1d3c87', Rabbitohs: '#0a7d3b', Sharks: '#1c9bd8', 'Sea Eagles': '#6d1f3d', Raiders: '#58a618', Eels: '#1d5fbf', Titans: '#1c9bd8', Bulldogs: '#1d5fbf', Cowboys: '#1d3a7a', Dragons: '#c8102e', 'Wests Tigers': '#e87722',
  'Wellington Phoenix': '#b08a00', 'Auckland FC': '#1f5bd8', 'Melbourne Victory': '#1c2a6b', 'Melbourne City': '#4a9fd8', 'Sydney FC': '#4a9fd8', 'Western Sydney': '#c8102e', 'Brisbane Roar': '#e87722', 'Perth Glory': '#5b2a86', 'Adelaide United': '#c8102e', 'Central Coast': '#c99700', Macarthur: '#b08a00', 'Newcastle Jets': '#1d3c87',
  Strikers: '#1f6fd6', Heat: '#00a3ad', 'Hobart Hurricanes': '#5b2a86', Renegades: '#c8102e', Stars: '#0a7d3b', Scorchers: '#e87722', Sixers: '#d6006f', Thunder: '#6aa51b',
  Auckland: '#1f6fd6', Canterbury: '#c8102e', Wellington: '#c99700', Otago: '#1d3a7a', Waikato: '#c8102e', Taranaki: '#c99700', 'Bay of Plenty': '#1f6fd6', Counties: '#c8102e', Northland: '#1f6fd6', 'North Harbour': '#1f6fd6', Tasman: '#e87722', "Hawke's Bay": '#c8102e', Manawat: '#0a7d3b', Southland: '#c8102e',
  'Northern Districts': '#0a7d3b', Central: '#e87722',
};
const COLOR_KEYS = Object.keys(TEAM_COLOR).sort((a, b) => b.length - a.length); // longest first: "Hobart Hurricanes" before "Hurricanes"
const colorOf = n => { const k = COLOR_KEYS.find(k => n.includes(k)); return k ? TEAM_COLOR[k] : '' };
const nmSpan = (n, e) => { const c = colorOf(n.replace(/\s+Women('s)?$/, '')); return `<span class="nm"${c ? ` style="--tc:${c}"` : ''}>${esc(displayName(n, e))}</span>` };
// flag lookups use the plain country name, the label uses the nickname
const teamNameR = (n, logo, e) => `${nmSpan(n, e)}${crest(n.replace(/\s+Women('s)?$/, ''), logo, true)}`;
const teamName = (n, logo, e) => `${crest(n.replace(/\s+Women('s)?$/, ''), logo)}${nmSpan(n, e)}`;
const START_LABEL = { rugby: 'Kick-off', league: 'Kick-off', football: 'Kick-off', cricket: 'First ball', mma: 'First fight', boxing: 'Main card' };
const SPORT_LABEL = { rugby: 'Rugby', cricket: 'Cricket', league: 'League', football: 'Football', mma: 'UFC', boxing: 'Boxing' };

const ALL_KEYS = TEAMS.flatMap(g => g.items.map(i => i[0]));

const store = {
  get(k, d) { try { const v = localStorage.getItem('sf.' + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('sf.' + k, JSON.stringify(v)) } catch {} },
};
let picked = new Set(store.get('teams', ALL_KEYS));
{ const known = new Set(store.get('known', ALL_KEYS)); ALL_KEYS.filter(k => !known.has(k)).forEach(k => picked.add(k)); store.set('known', ALL_KEYS); store.set('teams', [...picked]); }
let spoilers = store.get('spoilers', true);   // true = hide recent results
let spoilDays = store.get('spoilDaysSet', false) ? store.get('spoilDays', 4) : 4; // default 4 days covers Friday games checked on Monday
let revealed = new Set(store.get('revealed', []));
let newsKind = 'all';
let sportSel = store.get('sport', 'all');
let compSel = store.get('comp', '');
let genderSel = store.get('gender', 'all');
const WOMEN_TEAMS = new Set(['blackferns', 'whiteferns', 'kiwiferns', 'wbbl', 'fpc']);
// 'w' women's, 'm' men's, '' mixed or unknown (shown either way)
function genderOf(x) {
  if (WOMEN_TEAMS.has(x.team)) return 'w';
  const t = [x.comp, x.home, x.away, x.title].join(' ');
  if (/wheelchair/i.test(t)) return '';
  if (/women|ferns|wbbl|jillaroos|wallaroos|bulikula|nrlw|aupiki/i.test(t)) return 'w';
  if (x.sport === 'boxing') return '';
  return 'm';
}
// one name per competition, so a whole tournament can be shown on its own
function compOf(e) {
  const c = e.comp || '';
  if (e.sport === 'mma') return 'UFC';
  if (e.sport === 'boxing') return 'Boxing';
  if (e.team === 'wbbl' || /Women'?s Big Bash|WBBL/i.test(c)) return "Women's Big Bash";
  if (e.team === 'bbl' || /Big Bash|BBL/i.test(c)) return 'Big Bash';
  if (e.sport === 'league' && /World Cup/i.test(c)) return 'Rugby League World Cup';
  if (/NRL/.test(c) || e.team === 'nrl') return 'NRL';
  if (/NPC/.test(c)) return 'NPC';
  if (/Farah Palmer/i.test(c)) return 'Farah Palmer Cup';
  if (/A-League/i.test(c)) return 'A-League Men';
  if (/Super Rugby/i.test(c)) return 'Super Rugby Pacific';
  if (/Nations Championship/i.test(c)) return 'Nations Championship';
  if (/Bledisloe|Rugby Championship/i.test(c)) return 'Rugby Championship';
  if (e.team === 'blackcaps') return 'Black Caps';
  if (e.team === 'whiteferns') return 'White Ferns';
  if (e.team === 'nzdomestic') return 'NZ domestic cricket';
  return c.split(/[,·]/)[0].trim();
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (d, tz, o) => new Intl.DateTimeFormat('en-NZ', { timeZone: tz, ...o }).format(d);
const dayKey = (d, tz = NZ) => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const time = (d, tz) => fmt(d, tz, { hour: 'numeric', minute: '2-digit', hour12: true }).replace(' ', '').toLowerCase();
const dayLabel = (d, tz) => fmt(d, tz, { weekday: 'short', day: 'numeric', month: 'short' });
const cityOf = e => (e.city || '').split(',')[0];

// rough match lengths, used for "On now"
const HOURS = { Test: 7 * 24 * 0 + 8, ODI: 8, 'List A': 8, T20I: 3.5, T20: 3.5, 'First-class': 8 };
const DAYS = { Test: 5, 'First-class': 4 };
function onNow(e, now) {
  const s = new Date(e.startUTC);
  const days = DAYS[e.format] || 1;
  const hrs = e.sport === 'cricket' ? (HOURS[e.format] || 8) : 2;
  for (let i = 0; i < days; i++) {
    const a = s.getTime() + i * 864e5, b = a + hrs * 36e5;
    if (now >= a && now <= b) return days > 1 ? `Day ${i + 1}` : 'On now';
  }
  return null;
}
function countdown(e, now) {
  const ms = new Date(e.startUTC) - now;
  if (ms <= 0) return null;
  const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
  if (d >= 2) return `in ${d} days`;
  if (h >= 1) return `in ${h}h ${Math.floor(ms / 6e4) % 60}m`;
  return `in ${Math.max(1, Math.floor(ms / 6e4))}m`;
}
function canRehide(id, start, now) { return spoilers && revealed.has(id) && now - new Date(start) < spoilDays * 864e5; }
const rehideBtn = id => `<button class="rehide" type="button" data-rehide="${esc(id)}">Hide again</button>`;
function isHidden(e, now) {
  if (!spoilers || revealed.has(e.id)) return false;

// an event also shows for the other side when both are followed (e.g. Blues v Hurricanes)
const CLUBS = ['blues','chiefs','hurricanes','crusaders','highlanders','warriors'];

const visible = x => (genderSel === 'all' || !genderOf(x) || genderOf(x) === genderSel) && visible0(x);
const visible0 = x => x.startUTC ? (compSel ? compOf(x) === compSel : visibleTeam(x) && (sportSel === 'all' || (x.sport || sportOf(x.team)) === sportSel))
  : visibleTeam(x) && (sportSel === 'all' || sportOf(x.team) === sportSel);

function evCard(e, now) {
  const d = new Date(e.startUTC);
  const overseas = e.tz && e.tz !== NZ;
  const live = e.status === 'live' ? 'On now' : onNow(e, now);

  const urg = ms < 864e5 ? 'soon' : ms < 3 * 864e5 ? 'near' : 'later';

}
const LIVE_SITE = { cricket: ['Cricinfo', 'https://www.espncricinfo.com/live-cricket-score'] };
function liveLink(e) {
  const [name, url] = LIVE_SITE[e.sport] || ['match centre', e.source];
  return url ? `<a class="livelink" href="${esc(e.sport === 'cricket' ? url : e.source || url)}" target="_blank" rel="noopener">Live scores on ${esc(e.sport === 'cricket' ? name : 'the match page')} ↗</a>` : '';

}
function resCard(e, now) {
  const d = new Date(e.startUTC);
  const hidden = isHidden(e, now);
  const left = Math.ceil((spoilDays * 864e5 - (now - d)) / 864e5);
  const long = (e.score || '').length > 9;
  const right = hidden
    ? `<button class="cover" type="button" data-reveal="${esc(e.id)}"><b>Show result</b>hidden ${left} more day${left === 1 ? '' : 's'}</button>`
    : (e.score ? `<div class="score num ${long ? 'long' : ''}">${esc(e.score)}</div>` : `<div class="loc">Result not in yet</div>`) + (canRehide(e.id, e.startUTC, now) ? rehideBtn(e.id) : '');
  return `<article class="ev res sport-${e.sport}" data-open="${esc(e.id)}" tabindex="0" role="button" aria-label="${esc(displayName(e.home, e))} v ${esc(displayName(e.away, e))}, details">
    <div class="stripe"></div>
    <div class="body">
      <div class="comp">${badge(e.team)}<span>${esc(plural(e.comp))}</span></div>
      <div class="teams matchup"><span class="side home">${teamName(e.home, e.homeLogo, e)}</span><span class="v">v</span><span class="side away">${teamNameR(e.away, e.awayLogo, e)}</span></div>
      <div class="meta">${dayLabel(d, NZ)} · ${esc(e.city || '')}</div>
      ${hidden ? '' : `<div class="summary">${esc(e.summary || '')}</div>`}
    </div>
    <div class="when">${right}</div>
  </article>`;
}

function detail(e) {
  const now = Date.now(), d = new Date(e.startUTC);
  const overseas = e.tz && e.tz !== NZ;
  const isPast = e.status === 'final' || (d < now && !onNow(e, now) && e.status !== 'live');
  const hidden = isPast && isHidden(e, now);
  const when = e.timeTBC ? `${fmt(d, NZ, { weekday: 'long', day: 'numeric', month: 'long' })}, time to be confirmed`
    : `${time(d, NZ)} ${fmt(d, NZ, { weekday: 'long', day: 'numeric', month: 'long' })}`;
  const rows = [
    [`${START_LABEL[e.sport] || 'Start'} (NZ)`, when],
    overseas && !e.timeTBC ? ['Local', `${time(d, e.tz)} ${fmt(d, e.tz, { weekday: 'long' })} in ${cityOf(e)}`] : null,
    ['Where', [e.venue, e.city].filter(Boolean).join(', ') || 'To be confirmed'],
    e.note ? ['Note', e.note] : null,
  ].filter(Boolean);
  const b = e.broadcast && e.broadcast !== 'TBC' ? e.broadcast : '';
  const watch = [b && `<li><b>${esc(b)}</b></li>`, e.watchAlt && `<li>${esc(e.watchAlt)}</li>`, e.watchNote && `<li class="muted">${esc(e.watchNote)}</li>`].filter(Boolean).join('')
    || '<li class="muted">Broadcaster not confirmed yet</li>';
  const names = [e.home, e.away].map(n => String(n || '').replace(/ Women$/, ''));
  const related = (FEED.news || []).filter(n => n.team === e.team || (e.tags || []).includes(n.team) || (sportOf(n.team) === e.sport && names.some(x => x.length > 3 && x !== 'TBC' && !FLAGS[x] && (n.title + ' ' + n.summary).includes(x))))
    .filter(n => Math.abs(new Date(n.date) - d) < 21 * 864e5)
    .filter(n => !(hidden && n.kind === 'result'))
    .sort((a, c) => (a.kind === 'injury' ? -1 : 0) - (c.kind === 'injury' ? -1 : 0) || c.date.localeCompare(a.date)).slice(0, 6);
  const res = isPast ? (hidden
    ? `<button class="cover big" type="button" data-reveal="${esc(e.id)}"><b>Show result</b>Spoilers are hidden</button>`
    : `<div class="dres"><div class="score num">${esc(e.score || 'Result not in yet')}</div>${e.summary ? `<p>${esc(e.summary)}</p>` : ''}${canRehide(e.id, e.startUTC, now) ? rehideBtn(e.id) : ''}</div>`) : '';
  const live = e.status === 'live' || onNow(e, now) ? `<div class="dres"><span><span class="tag live">On now</span></span>${liveLink(e)}</div>` : '';
  return `<div class="sheet-head sport-${e.sport}">
      <div class="comp">${badge(e.team)}<span>${esc(plural(e.comp))}</span></div>
      <h2 class="dteams">${teamName(e.home, e.homeLogo, e)} <span class="v">v</span> ${teamName(e.away, e.awayLogo, e)}</h2>
      ${!isPast && e.status !== 'live' && countdown(e, now) ? `<span class="tag ${d - now < 864e5 ? 'soon' : d - now < 3 * 864e5 ? 'near' : 'later'}">${countdown(e, now)}</span>` : ''}
    </div>
    ${res}${live}
    <dl class="facts">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <h3 class="dh">Watch in NZ</h3><ul class="watchlist">${watch}${e.coverageUTC ? `<li>Coverage from ${time(new Date(e.coverageUTC), NZ)}</li>` : ''}</ul>
    <h3 class="dh">Team news</h3>
    ${related.length ? `<div class="news">${related.map(n => `<a class="dn-item" href="${esc(n.url)}" target="_blank" rel="noopener">${n.image ? `<img class="thumb sm" src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '<span></span>'}<span class="dn-text"><span class="dn-meta"><span class="kind ${n.kind}">${esc(n.kind === 'news' ? 'News' : n.kind)}</span><span class="muted">${esc(n.source || '')}</span></span><b>${esc(n.title)}</b></span></a>`).join('')}</div>` : '<p class="muted">No recent news for this match yet.</p>'}
    ${e.source ? `<p><a class="srclink" href="${esc(e.source)}" target="_blank" rel="noopener">${e.status === 'live' ? 'Follow live on the match page' : 'Match page'}</a>${e.sport === 'cricket' ? ` · <a class="srclink" href="https://www.espncricinfo.com/live-cricket-score" target="_blank" rel="noopener">Ball by ball on Cricinfo</a>` : ''}</p>` : ''}`;
}
function openDetail(id) {
  const e = (FEED.events || []).find(x => x.id === id);
  if (!e) return;
  $('sheetBody').innerHTML = detail(e);
  const dlg = $('sheet');
  dlg.dataset.id = id;
  if (!dlg.open) dlg.showModal();
}

function render() {
  const now = Date.now();
  const nowD = new Date(now);
  const evs = (FEED.events || []).filter(visible).sort((a, b) => a.startUTC.localeCompare(b.startUTC));
  const todayK = dayKey(nowD);
  const upcoming = evs.filter(e => e.status === 'live' || (e.status !== 'final' && (new Date(e.startUTC) > now || onNow(e, now))));
  const finals = evs.filter(e => e.status === 'final' || (e.status !== 'live' && new Date(e.startUTC) < now && !onNow(e, now) && !e.timeTBC)).reverse();

  // week strip
  const days = [...Array(7)].map((_, i) => new Date(now + i * 864e5));
  $('weekRange').textContent = `${dayLabel(days[0], NZ)} to ${dayLabel(days[6], NZ)}`;
  $('week').innerHTML = days.map(d => {
    const k = dayKey(d);
    const list = evs.filter(e => dayKey(new Date(e.startUTC)) === k);
    const dots = list.slice(0, 6).map(e => `<span class="dot" style="background:var(--${e.sport})"></span>`).join('');
    return `<button class="day ${k === todayK ? 'today' : ''} ${list.length ? '' : 'empty'}" type="button" data-jump="${k}" aria-label="${dayLabel(d, NZ)}, ${list.length} games">
      <span class="dn">${k === todayK ? 'Today' : fmt(d, NZ, { weekday: 'short' })}</span>
      <span class="dd num">${fmt(d, NZ, { day: 'numeric' })}</span>
      <span class="dots">${dots}</span></button>`;
  }).join('');

  // today
  const todays = upcoming.filter(e => dayKey(new Date(e.startUTC)) === todayK || e.status === 'live' || onNow(e, now));
  $('todayLabel').textContent = dayLabel(nowD, NZ);
  // today's finished games stay in "On today" (spoiler rules still apply), latest first after the upcoming ones
  const doneToday = finals.filter(e => dayKey(new Date(e.startUTC)) === todayK);
  $('today').innerHTML = todays.length || doneToday.length
    ? `<div class="daygroup">${(() => {
        const live = todays.filter(e => e.status === 'live' || onNow(e, now)), later = todays.filter(e => !live.includes(e));
        return live.map(e => evCard(e, now)).join('') + (live.length && later.length ? `<div class="dayhead">Later today</div>` : '') + later.map(e => evCard(e, now)).join('');
      })()}${doneToday.length ? `<div class="dayhead">Earlier today</div><div class="donetoday">${doneToday.map(e => resCard(e, now)).join('')}</div>` : ''}</div>`
    : `<div class="empty-note">Nothing on for your teams today. ${upcoming[0] ? `Next up: <b>${esc(upcoming[0].home)} v ${esc(upcoming[0].away)}</b>, ${dayLabel(new Date(upcoming[0].startUTC), NZ)}.` : ''}</div>`;

  // coming up, grouped by NZ day
  const rest = upcoming.filter(e => !todays.includes(e));
  const groups = new Map();
  rest.forEach(e => { const k = dayKey(new Date(e.startUTC)); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e) });
  const weekEnd = dayKey(new Date(now + 13 * 864e5));
  const showAll = store.get('showAllUp', false);
  let html = '', n = 0, hiddenCount = 0;
  for (const [k, list] of groups) {
    if (!showAll && k > weekEnd && n >= 4) { hiddenCount += list.length; continue }
    const d = new Date(list[0].startUTC);
    const lbl = fmt(d, NZ, { weekday: 'long', day: 'numeric', month: 'long' });
    html += `<div class="daygroup"><div class="dayhead" id="d-${k}">${lbl}</div>${list.map(e => evCard(e, now)).join('')}</div>`;
    n += list.length;
  }
  if (hiddenCount) html += `<div class="daygroup"><button class="btn more" id="moreUp" type="button">Show ${hiddenCount} more fixtures</button></div>`;
  $('upcoming').innerHTML = html || `<div class="empty-note">No fixtures for your teams yet. Pick more teams under My teams.</div>`;

  // results
  const pastFinals = finals.filter(e => dayKey(new Date(e.startUTC)) !== todayK);
  // group past results: Yesterday, The weekend (on Mon/Tue), then by day
  const yK = dayKey(new Date(now - 864e5));
  const wd = new Date(nowD.toLocaleString('en-US', { timeZone: NZ })).getDay(); // 0 Sun .. 6 Sat, in NZ
  const weekendKeys = wd === 1 || wd === 2 ? [3, 2, 1].map(back => dayKey(new Date(now - (wd + back - 1) * 864e5))) : [];
  const groupOf = e => {
    const k = dayKey(new Date(e.startUTC));
    if (weekendKeys.includes(k)) return 'The weekend';
    if (k === yK) return 'Yesterday';
    return fmt(new Date(e.startUTC), NZ, { weekday: 'long', day: 'numeric', month: 'short' });
  };
  const rgroups = new Map();
  pastFinals.slice(0, 14).forEach(e => { const g = groupOf(e); if (!rgroups.has(g)) rgroups.set(g, []); rgroups.get(g).push(e); });
  $('results').innerHTML = rgroups.size
    ? [...rgroups].map(([g, list]) => `<div class="daygroup"><div class="dayhead">${esc(g)}</div>${list.map(e => resCard(e, now)).join('')}</div>`).join('')
    : `<div class="empty-note">No recent results for your teams.</div>`;

  // news
  const kinds = [['all', 'All'], ['injury', 'Injuries'], ['squad', 'Squads'], ['result', 'Results'], ['news', 'Other']];
  $('newsFilters').innerHTML = kinds.map(([k, l]) => `<button class="chip" type="button" data-kind="${k}" aria-pressed="${newsKind === k}">${l}</button>`).join('');
  const items = (FEED.news || []).filter(visible).filter(n => newsKind === 'all' || n.kind === newsKind).sort((a, b) => b.date.localeCompare(a.date));
  $('news').innerHTML = items.length ? items.slice(0, 30).map(n => {
    const hide = spoilers && n.kind === 'result' && !revealed.has('n:' + n.id) && (now - new Date(n.date + 'T12:00:00+13:00')) < spoilDays * 864e5;
    const sport = sportOf(n.team);
    const img = n.image && !hide ? `<img class="thumb" src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
    return `<article class="ni sport-${sport} ${img ? 'has-img' : ''}">${img}<div class="ni-body">
      <div class="top">${badge(n.team)}<span class="kind ${n.kind}">${esc(n.kind === 'news' ? 'News' : n.kind)}</span><span>${esc(TEAM_NAME[n.team] || '')}</span><span class="num">${fmt(new Date(n.date + 'T12:00:00+13:00'), NZ, { day: 'numeric', month: 'short' })}</span><span>${esc(n.source || '')}</span></div>
      ${hide ? `<button class="cover" type="button" data-reveal="n:${esc(n.id)}"><b>Result story hidden</b>tap to show</button>`
        : `<h3>${esc(n.title)}</h3><p>${esc(n.summary)}</p>${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">Read at ${esc(n.source || 'source')}</a>` : ''}`}
    </div></article>`;
  }).join('') : `<div class="empty-note">No news in this category for your teams.</div>`;

  // controls
  {
    const counts = new Map(), sportOfComp = new Map();
    (FEED.events || []).filter(e => Math.abs(new Date(e.startUTC) - now) < 21 * 864e5).forEach(e => { const c = compOf(e); counts.set(c, (counts.get(c) || 0) + 1); sportOfComp.set(c, e.sport || sportOf(e.team)); });
    const comps = [...counts].filter(([c, n]) => n >= 2 || c === compSel).sort((a, b) => b[1] - a[1]).map(([c]) => c);
    const groups = [['rugby', 'Rugby'], ['league', 'Rugby league'], ['cricket', 'Cricket'], ['football', 'Football'], ['mma', 'UFC'], ['boxing', 'Boxing']];
    const opt = c => `<option value="${esc(c)}" ${c === compSel ? 'selected' : ''}>${esc(c)}</option>`;
    $('compSel').innerHTML = `<option value="">All competitions</option>` + groups.map(([k, l]) => {
      const cs = comps.filter(c => sportOfComp.get(c) === k);
      return !cs.length ? '' : cs.length === 1 && cs[0] === l ? opt(cs[0]) : `<optgroup label="${l}">${cs.map(opt).join('')}</optgroup>`;
    }).join('');
    $('compSel').classList.toggle('on', !!compSel);
    $('genderSel').innerHTML = [['all', 'All'], ['m', "Men's"], ['w', "Women's"]].map(([k, l]) => `<button type="button" data-gender="${k}" aria-pressed="${genderSel === k}">${l}</button>`).join('');
    $('sportFilter').classList.toggle('dim', !!compSel);
  }
  $('sportFilter').innerHTML = [['all','All'],['rugby','Rugby'],['cricket','Cricket'],['league','League'],['football','Football'],['mma','UFC'],['boxing','Boxing']].map(([k, l]) => `<button type="button" data-sport="${k}" aria-pressed="${sportSel === k}" class="chip sportchip sport-${k}">${l}</button>`).join('');
  $('spoilBtn').setAttribute('aria-pressed', String(!spoilers));
  $('spoilBtn').textContent = spoilers ? 'Spoilers hidden' : 'Spoilers shown';
  $('teamsBtn').textContent = `My teams (${picked.size})`;
  $('spoilDays').value = String(spoilDays);
  $('teamGroups').innerHTML = TEAMS.map(g => `<div class="group"><h3>${g.g}</h3><div class="chips">${g.items.map(([k, l]) => `<button class="chip" type="button" data-team="${k}" aria-pressed="${picked.has(k)}">${badge(k)}${l}</button>`).join('')}</div></div>`).join('');
}
const SPORT = { rugby: ['allblacks','blackferns','npc','fpc','blues','chiefs','hurricanes','crusaders','highlanders','moana','wallabies','aurugby','superrugby'], cricket: ['blackcaps','whiteferns','nzdomestic','bbl','wbbl'], league: ['kiwis','kiwiferns','warriors','nrl','rlwc'], football: ['phoenix','aucklandfc','aleague'], mma: ['ufc'], boxing: ['boxing','nzboxing'] };
const sportOf = t => Object.keys(SPORT).find(s => SPORT[s].includes(t)) || 'rugby';

function tick() { $('clock').textContent = `NZ ${fmt(new Date(), NZ, { weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true })}` }

document.addEventListener('click', ev => {
  if (ev.target.closest('a')) return;
  const t = ev.target.closest('button');
  if (!t) { const card = ev.target.closest('[data-open]'); if (card) openDetail(card.dataset.open); else if (ev.target === $('sheet')) $('sheet').close(); return; }
  if (t.id === 'sheetClose') { $('sheet').close(); return; }
  if (t.dataset.team) { const k = t.dataset.team; picked.has(k) ? picked.delete(k) : picked.add(k); store.set('teams', [...picked]); render(); }
  else if (t.dataset.reveal) { ev.stopPropagation(); revealed.add(t.dataset.reveal); store.set('revealed', [...revealed]); render(); if ($('sheet').open) openDetail($('sheet').dataset.id); }
  else if (t.dataset.rehide) { ev.stopPropagation(); revealed.delete(t.dataset.rehide); store.set('revealed', [...revealed]); render(); if ($('sheet').open) openDetail($('sheet').dataset.id); }
  else if (t.dataset.gender) { genderSel = t.dataset.gender; store.set('gender', genderSel); render(); }
  else if (t.dataset.sport) { compSel = ''; store.set('comp', ''); sportSel = t.dataset.sport; store.set('sport', sportSel); render(); }
  else if (t.dataset.kind) { newsKind = t.dataset.kind; render(); }
  else if (t.dataset.jump) { const el = document.getElementById('d-' + t.dataset.jump) || (t.dataset.jump === dayKey(new Date()) ? $('todaySec') : null); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }
  else if (t.id === 'moreUp') { store.set('showAllUp', true); render(); }
  else if (t.id === 'spoilBtn') { spoilers = !spoilers; store.set('spoilers', spoilers); render(); }
  else if (t.id === 'teamsBtn') { const p = $('panel'); p.hidden = !p.hidden; t.setAttribute('aria-expanded', String(!p.hidden)); }
  else if (t.id === 'allOn') { picked = new Set(ALL_KEYS); store.set('teams', ALL_KEYS); render(); }
  else if (t.id === 'allOff') { picked = new Set(); store.set('teams', []); render(); }
});
document.addEventListener('keydown', ev => { const c = ev.target.closest?.('[data-open]'); if (c && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openDetail(c.dataset.open); } });
$('compSel').addEventListener('change', e => { compSel = e.target.value; store.set('comp', compSel); render(); });
$('spoilDays').addEventListener('change', e => { spoilDays = +e.target.value; store.set('spoilDays', spoilDays); store.set('spoilDaysSet', true); render(); });

function stamp() {
  if (!FEED.generatedAt) return;
  const mins = Math.round((Date.now() - new Date(FEED.generatedAt)) / 6e4);
  $('mockNote').textContent = `Updated ${mins < 1 ? 'just now' : mins < 60 ? mins + ' min ago' : fmt(new Date(FEED.generatedAt), NZ, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', hour12: true })}. Results update about every 15 minutes.`;
}
async function load() {
  try {
    const r = await fetch('data/feed.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    FEED = await r.json();
    $('foot').innerHTML = `Sources: ${(FEED.sources || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ')}`;
    render(); stamp();
  } catch (e) {
    if (!FEED.generatedAt) $('mockNote').textContent = 'Could not load the feed. Check your connection and refresh the page.';
  }
}
tick(); render(); load();
setInterval(() => { tick(); render(); stamp(); }, 60000);
setInterval(load, 5 * 60000);
})();
</script>

</body>
