<style>
/* Layout: sticky scoreboard header, week strip, then one column of day-grouped fixture rows, results and news. */
:root {
  --paper: #f3f6f4; --surface: #ffffff; --ink: #14211c; --muted: #5a6a64; --line: #d9e2de;
  --accent: #0d6b4d; --accent-ink: #ffffff; --soft: #e6efeb;
  --rugby: #17704f; --cricket: #1d5ea6; --league: #b0521a; --football: #6741d9; --mma: #a61e4d;
  --live: #c8322a; --cover: #dfe6e3;
  --soon: #d9480f; --near: #7048e8; --later: #5a6a64; --local: #1971c2;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1412; --surface: #161f1c; --ink: #e6eeea; --muted: #93a49d; --line: #25322d;
  --accent: #46c093; --accent-ink: #08130f; --soft: #1c2925;
  --rugby: #46c093; --cricket: #7fb1ef; --league: #f09c62; --football: #b197fc; --mma: #f783ac;
  --live: #ff6b5f; --cover: #25322d; --soon: #ff8a4c; --near: #a98bff; --later: #93a49d; --local: #74b9ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0e1412; --surface: #161f1c; --ink: #e6eeea; --muted: #93a49d; --line: #25322d;
  --accent: #46c093; --accent-ink: #08130f; --soft: #1c2925;
  --rugby: #46c093; --cricket: #7fb1ef; --league: #f09c62; --football: #b197fc; --mma: #f783ac;
  --live: #ff6b5f; --cover: #25322d; --soon: #ff8a4c; --near: #a98bff; --later: #93a49d; --local: #74b9ff; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0 }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; line-height: 1 }
.brand span { color: var(--accent) }
.clock { color: var(--muted); font-size: 13px }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: center }
.btn:hover { border-color: var(--accent) }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }

.mock { background: var(--soft); color: var(--muted); font-size: 13px }
.mock .wrap { padding-block: 8px }

.panel { background: var(--surface); border-bottom: 1px solid var(--line) }
.panel .wrap { padding-block: 16px; display: grid; gap: 14px }
.group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--f-body); font-weight: 700; margin-bottom: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 14px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.spoil-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px }
select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink) }

main { padding-block: 18px 48px; display: grid; gap: 28px }
section > h2 { font-size: 22px; text-transform: uppercase; letter-spacing: .04em; display: flex; flex-wrap: wrap; column-gap: 10px; align-items: baseline; gap: 10px; margin-bottom: 10px }
section > h2 small { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--muted); font-weight: 400 }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 4px; text-align: center; cursor: pointer; display: grid; gap: 2px; min-width: 0 }
.day:hover { border-color: var(--accent) }
.day .dn { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.day .dd { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1 }
.day .dots { display: flex; gap: 3px; justify-content: center; min-height: 8px; flex-wrap: wrap }
.dot { width: 7px; height: 7px; border-radius: 50% }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.day.empty .dd { color: var(--muted) }

.daygroup { display: grid; gap: 8px }
.daygroup + .daygroup { margin-top: 14px }
.dayhead { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); scroll-margin-top: 80px }

.ev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; overflow: hidden }
.ev .stripe { background: var(--sport) }
.ev .body { padding: 10px 12px; min-width: 0; display: grid; gap: 2px }
.ev .comp { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--sport); font-weight: 700 }
.ev .teams { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.15 }
.ev .teams .v { color: var(--muted); font-weight: 500; padding-inline: 4px }
.ev .meta { font-size: 13px; color: var(--muted) }
.watch { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; margin-top: 4px }
.watch .wl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; border: 1px solid var(--sport); color: var(--sport); border-radius: 4px; padding: 0 5px }
.watch .alt { font-weight: 600 }
.watch .muted { color: var(--muted) }
.ev .when { padding: 10px 12px; text-align: right; display: grid; align-content: center; gap: 2px; border-left: 1px dashed var(--line); min-width: 112px }
.ev .nz { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1 }
.ev .nzl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.ev .loc { font-size: 12px; color: var(--muted) }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: var(--soft); color: var(--ink); justify-self: end }
.tag.live { background: var(--live); color: #fff }
.sport-rugby { --sport: var(--rugby) } .sport-cricket { --sport: var(--cricket) } .sport-league { --sport: var(--league) } .sport-football { --sport: var(--football) } .sport-mma { --sport: var(--mma) }

.res .when { min-width: 120px }
.res .score { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1 }
.res .score.long { font-size: 15px; font-family: var(--f-body); font-weight: 600; line-height: 1.3 }
.res .summary { font-size: 14px; margin-top: 2px }
.cover { background: var(--cover); border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; text-align: center; line-height: 1.25 }
.cover b { display: block; font-size: 14px }

.news { display: grid; gap: 8px }
.ni { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 3px }
.ni .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.kind { text-transform: uppercase; letter-spacing: .07em; font-weight: 700; font-size: 11px; border-radius: 4px; padding: 1px 5px; background: var(--soft); color: var(--ink) }
.kind.injury { background: var(--live); color: #fff }
.ni h3 { font-family: var(--f-body); font-size: 16px; font-weight: 700; line-height: 1.3 }
.ni p { margin: 0; font-size: 14px; color: var(--muted); max-width: 68ch }
.ni a { color: var(--accent); font-size: 13px }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px }
.empty-note { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px }
.more { justify-self: start }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px }
footer a { color: var(--muted) }


.badge { display: inline-grid; place-items: center; min-width: 30px; height: 18px; padding: 0 4px; border-radius: 4px; font: 700 10px/1 var(--f-body); letter-spacing: .03em; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent); flex: none }
.ev .comp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px }
.sp { background: var(--sport); color: var(--paper); border-radius: 4px; padding: 1px 6px; font-size: 10px; letter-spacing: .08em }
.flag { margin-right: 5px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif }
.chip { display: inline-flex; align-items: center; gap: 6px }
.sportchip.sport-all { --sport: var(--ink) }
.sportchip { border-color: var(--sport) }
.sportchip[aria-pressed="true"] { background: var(--sport); border-color: var(--sport); color: var(--paper) }
.sport-rugby .ev, .ev.sport-rugby { background: color-mix(in srgb, var(--rugby) 5%, var(--surface)) }
.ev.sport-cricket { background: color-mix(in srgb, var(--cricket) 5%, var(--surface)) }
.ev.sport-league { background: color-mix(in srgb, var(--league) 6%, var(--surface)) }
.ev.sport-football { background: color-mix(in srgb, var(--football) 6%, var(--surface)) }
.ev.sport-mma { background: color-mix(in srgb, var(--mma) 6%, var(--surface)) }
.ev .stripe { width: 6px }
.ni .top .badge { margin-right: 2px }
#sportFilter { margin-bottom: -10px }


.ev .nz { color: var(--sport) }
.ev .date { font-size: 13px; font-weight: 700; color: var(--ink) }
.ev .loc { color: var(--local) }
.tag.soon { background: var(--soon); color: #fff }
.tag.near { background: var(--near); color: #fff }
.tag.later { background: transparent; color: var(--later); box-shadow: inset 0 0 0 1px var(--line) }
.dayhead { color: var(--ink) }
.dayhead::after { content: ""; display: block; height: 2px; width: 32px; background: var(--accent); margin-top: 4px; border-radius: 2px }


.ev[data-open] { cursor: pointer }
.ev .nz.longsc { font-family: var(--f-body); font-size: 15px; line-height: 1.3 }
.ev .tv { color: var(--ink); font-weight: 600 }
dialog#sheet { border: 0; padding: 0; margin: auto auto 0; width: min(640px, 100%); max-height: 88vh; border-radius: 16px 16px 0 0; background: var(--surface); color: var(--ink); box-shadow: 0 -8px 40px rgba(0,0,0,.25) }
@media (min-width: 700px) { dialog#sheet { margin: auto; border-radius: 16px } }
dialog#sheet::backdrop { background: rgba(10, 18, 15, .5) }
.sheet-in { padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; overflow-y: auto; max-height: 88vh }
.close { justify-self: end; position: sticky; top: 0 }
.sheet-head { display: grid; gap: 6px; border-left: 5px solid var(--sport); padding-left: 12px }
.sheet-head .comp { display: flex; gap: 6px; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--sport); font-weight: 700 }
.dteams { font-size: 28px; line-height: 1.1 }
.dteams .v { color: var(--muted); font-weight: 500 }
.sheet-head .tag { justify-self: start }
.dres { display: grid; gap: 4px; background: var(--paper); border-radius: 10px; padding: 10px 12px }
.dres .score { font-family: var(--f-display); font-size: 30px; font-weight: 700 }
.dres p { margin: 0 }
.cover.big { padding: 14px; font-size: 14px }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px }
.facts dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px }
.facts dd { margin: 0 }
.dh { font-family: var(--f-body); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 4px }
.watchlist { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px }
.muted { color: var(--muted) }
.dn-item { display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.35 }
.dn-item:hover { border-color: var(--accent) }
.srclink { color: var(--accent); font-size: 14px }


.ni.has-img { grid-template-columns: 96px minmax(0, 1fr); column-gap: 12px; align-items: start }
.ni-body { display: grid; gap: 3px; min-width: 0 }
.thumb { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--soft) }
.thumb.sm { width: 56px; height: 42px; float: left; margin-right: 10px }
.dn-item::after { content: ""; display: block; clear: both }
@media (max-width: 420px) { .ni.has-img { grid-template-columns: 72px minmax(0, 1fr) } .thumb { width: 72px; height: 56px } }

@media (max-width: 560px) {
  .ev { grid-template-columns: 6px minmax(0, 1fr) }
  .ev .when { grid-column: 2; border-left: 0; border-top: 1px dashed var(--line); text-align: left; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0 }
  .tag { justify-self: start }
  .ev .teams { font-size: 19px }
  .day .dd { font-size: 20px }
  .day { padding: 6px 2px }
}
@media (prefers-reduced-motion: no-preference) { .ev, .ni { transition: border-color .15s } }
.ev:hover, .ni:hover { border-color: color-mix(in srgb, var(--sport, var(--accent)) 50%, var(--line)) }
</style>
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">Sports <span>Feed</span></div>
    <div class="clock num" id="clock"></div>
    <div class="spacer"></div>
    <button class="btn" id="spoilBtn" aria-pressed="false" type="button">Spoilers hidden</button>
    <button class="btn" id="teamsBtn" aria-expanded="false" aria-controls="panel" type="button">My teams</button>
  </div>
</header>
<div class="mock"><div class="wrap" id="mockNote">Loading the latest fixtures and scores…</div></div>
<div class="panel" id="panel" hidden>
  <div class="wrap">
    <div id="teamGroups" style="display:grid;gap:12px"></div>
    <div class="spoil-row">
      <label for="spoilDays">Hide results for</label>
      <select id="spoilDays">
        <option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option>
        <option value="5">5 days</option><option value="7">7 days</option>
      </select>
      <span style="color:var(--muted)">after the match, while spoilers are hidden</span>
    </div>
    <div class="chips"><button class="btn" id="allOn" type="button">Select all</button><button class="btn" id="allOff" type="button">Clear</button></div>
  </div>
</div>

<main class="wrap">
  <div class="chips" id="sportFilter" role="group" aria-label="Show sport"></div>
  <section id="weekSec">
    <h2>This week <small id="weekRange"></small></h2>
    <div class="week" id="week"></div>
  </section>
  <section id="todaySec">
    <h2>On today <small id="todayLabel"></small></h2>
    <div id="today"></div>
  </section>
  <section id="upSec">
    <h2>Coming up <small>Times in NZ, with local time for overseas games</small></h2>
    <div id="upcoming"></div>
  </section>
  <section id="resSec">
    <h2>Recent results</h2>
    <div id="results" class="daygroup"></div>
  </section>
  <section id="newsSec">
    <h2>News &amp; injuries</h2>
    <div class="filters" id="newsFilters"></div>
    <div id="news" class="news"></div>
  </section>
</main>
<footer class="wrap" id="foot"></footer>
<dialog id="sheet" aria-label="Match details">
  <div class="sheet-in">
    <button class="btn close" id="sheetClose" type="button" aria-label="Close">Close</button>
    <div id="sheetBody"></div>
  </div>
</dialog>

<script>
(() => {
let FEED = { events: [], news: [], sources: [] };
const NZ = 'Pacific/Auckland';
const TEAMS = [
  { g: 'Rugby', items: [['allblacks','All Blacks'],['blackferns','Black Ferns'],['npc','NPC'],['fpc','Farah Palmer Cup'],['wallabies','Wallabies']] },
  { g: 'Super Rugby Pacific', items: [['blues','Blues'],['chiefs','Chiefs'],['hurricanes','Hurricanes'],['crusaders','Crusaders'],['highlanders','Highlanders'],['moana','Moana Pasifika'],['aurugby','Australian teams'],['superrugby','Every game']] },
  { g: 'Cricket', items: [['blackcaps','Black Caps'],['whiteferns','White Ferns'],['nzdomestic','Domestic cricket'],['bbl','Big Bash'],['wbbl','Women\'s Big Bash']] },
  { g: 'Rugby league', items: [['kiwis','Kiwis'],['kiwiferns','Kiwi Ferns'],['warriors','Warriors'],['nrl','NRL (every game)'],['rlwc','League World Cup (every game)']] },
  { g: 'Football', items: [['phoenix','Wellington Phoenix'],['aucklandfc','Auckland FC'],['aleague','A-League Men (every game)']] },
  { g: 'UFC', items: [['ufc','UFC events']] },
];
const TEAM_NAME = Object.fromEntries(TEAMS.flatMap(g => g.items));
// team badges (colours + short code) and country flags
const BADGE = {
  allblacks: ['AB', '#000000', '#ffffff'], blackferns: ['BF', '#000000', '#ffffff'], npc: ['NPC', '#c8102e', '#ffffff'], fpc: ['FPC', '#6d2077', '#ffffff'],
  blues: ['BLU', '#0b3d91', '#ffffff'], chiefs: ['CHI', '#d6001c', '#ffd200'], hurricanes: ['HUR', '#ffcd00', '#000000'], crusaders: ['CRU', '#c8102e', '#000000'],
  highlanders: ['HIG', '#1d2f6f', '#f2a900'], moana: ['MP', '#00807f', '#ffffff'],
  blackcaps: ['BC', '#111111', '#7fe0d0'], whiteferns: ['WF', '#ffffff', '#111111'], nzdomestic: ['NZC', '#2b3a67', '#ffffff'],
  wallabies: ['WAL', '#f2c200', '#0b3d2e'], aurugby: ['AUS', '#0b3d91', '#f2c200'], superrugby: ['SRP', '#00205b', '#ffffff'],
  bbl: ['BBL', '#ff6b00', '#111111'], wbbl: ['WBBL', '#7b2cbf', '#ffffff'], nrl: ['NRL', '#003b7a', '#ffffff'], rlwc: ['RLWC', '#0b6e4f', '#ffffff'],
  phoenix: ['WNP', '#ffd100', '#000000'], aucklandfc: ['AFC', '#0033a0', '#ffffff'], aleague: ['ALM', '#e4002b', '#ffffff'], ufc: ['UFC', '#d20a0a', '#ffffff'],
  kiwis: ['KIW', '#000000', '#ffffff'], kiwiferns: ['KF', '#000000', '#ffffff'], warriors: ['WAR', '#0d1f4c', '#7fd13b'],
};
const badge = k => { const b = BADGE[k]; return b ? `<span class="badge" style="background:${b[1]};color:${b[2]}" aria-hidden="true">${b[0]}</span>` : ''; };
const FLAGS = {
  'New Zealand': '🇳🇿', 'All Blacks': '🇳🇿', 'Black Ferns': '🇳🇿', Australia: '🇦🇺', Wallabies: '🇦🇺', England: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', Scotland: '🏴󠁧󠁢󠁳󠁣󠁴󠁿',

function applyComp(e, comp, st) {
  const cs = comp?.competitors || [];
  const home = cs.find(c => c.homeAway === 'home') || cs[0], away = cs.find(c => c.homeAway === 'away') || cs[1];
  const state = st?.type?.state || st?.state;
  if (state === 'in') e.status = 'live'; else if (state === 'post') e.status = 'final';
  if (e.sport !== 'mma' && home && away && home.score != null && state !== 'pre') e.score = `${home.score.displayValue ?? home.score}-${away.score.displayValue ?? away.score}`;
  e.clock = st?.type?.shortDetail || st?.shortDetail || e.clock;
}
async function pollLive() {
  const now = Date.now();
  const list = liveCandidates(now);
  if (!list.length) return;
  let changed = false;
  await Promise.all(list.map(async e => {
    try {
      if (e.espnPath === 'cricket-header') {
        const r = await fetch('https://site.web.api.espn.com/apis/v2/scoreboard/header?sport=cricket&region=au&lang=en&contentorigin=espn');
        const d = await r.json();
        const ev = (d.sports?.[0]?.leagues || []).flatMap(l => l.events || []).find(x => String(x.id) === String(e.espnId));
        if (!ev) return;
        const state = ev.status || ev.fullStatus?.type?.state;
        e.status = state === 'in' ? 'live' : state === 'post' ? 'final' : e.status;
        const comps = ev.competitors || [];
        const sc = comps.map(c => c.score ? `${c.abbreviation || c.displayName} ${c.score}` : '').filter(Boolean).join(' v ');
        if (sc) e.score = sc;
        e.clock = ev.summary || e.clock;
        if (e.status === 'final') e.summary = ev.summary || e.summary;
      } else {
        const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${e.espnPath}/summary?event=${e.espnId}`);
        const d = await r.json();
        const comp = d.header?.competitions?.[0];
        if (!comp) return;
        if (e.sport === 'mma') { const st = comp.status; if (st?.type?.state === 'in') e.status = 'live'; e.clock = st?.type?.shortDetail || e.clock; }
        else applyComp(e, comp, comp.status);
      }
      changed = true;
    } catch { /* blocked or offline: the scheduled rebuild still updates scores */ }
  }));
  if (changed) { liveAt = Date.now(); render(); if ($('sheet').open) openDetail($('sheet').dataset.id); }
}
tick(); render(); load().then(pollLive);
setInterval(pollLive, LIVE_POLL_MS);
setInterval(() => { tick(); render(); stamp(); }, 60000);
setInterval(load, 5 * 60000);
})();
</script>
